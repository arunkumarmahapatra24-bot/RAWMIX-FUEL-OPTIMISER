<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raw Mix &amp; Fuel Cost Optimiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style id="appcss">:root{
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --fh:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --bg:#ECEEEA; --surface:#FFFFFF; --sunk:#F5F6F3; --ink:#1B2630; --muted:#5A6670; --line:#D2D7D2;
  --steel:#245B7A; --steel-soft:#DCE8EF; --flame:#B8620F; --flame-soft:#F6E3CF;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --bad:#A93A2C; --bad-soft:#F6DEDA; --band:#CFE0D6;
  --shadow:0 1px 0 rgba(27,38,48,.06);
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A1F; --surface:#1C242B; --sunk:#182026; --ink:#E4E9E6; --muted:#97A3AB; --line:#2D3940;
  --steel:#7DB3D3; --steel-soft:#21384A; --flame:#E39A52; --flame-soft:#3D2C1C;
  --ok:#6CC08F; --ok-soft:#1E3A2A; --bad:#E58A7C; --bad-soft:#41241F; --band:#2A4536; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#141A1F; --surface:#1C242B; --sunk:#182026; --ink:#E4E9E6; --muted:#97A3AB; --line:#2D3940;
  --steel:#7DB3D3; --steel-soft:#21384A; --flame:#E39A52; --flame-soft:#3D2C1C;
  --ok:#6CC08F; --ok-soft:#1E3A2A; --bad:#E58A7C; --bad-soft:#41241F; --band:#2A4536; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{font-size:calc(16px * var(--scale,1))}
body{margin:0;background:var(--bg);color:var(--ink);font:.9375rem/var(--lh,1.5) var(--fb);font-variant-numeric:tabular-nums}
h1,h2,h3,.cond{font-family:var(--fh)}
h2{font-size:1.35rem;margin:0 0 .25rem;font-weight:600;letter-spacing:.005em}
h3{font-size:1.05rem;margin:1.4rem 0 .5rem;font-weight:600}
p{margin:.3rem 0 .8rem;max-width:75ch}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--hdr-bg);color:var(--hdr-ink);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);top:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr-bg)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.kiln{width:34px;height:34px;flex:none}
.brand b{display:block;font:600 1.12rem/1.1 var(--fh)}
.brand span{display:block;font-size:.8rem;color:var(--hdr-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);max-width:200px}
.live label{color:var(--hdr-muted)}
.chip{color:var(--ink);display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-size:.85rem;white-space:nowrap}
.chip b{font:600 1rem var(--fh)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)} .chip.bad{border-color:var(--bad);background:var(--bad-soft)}
nav.tabs{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;padding:0 12px}
nav.tabs .tsep{width:1px;height:20px;background:var(--hdr-muted);opacity:.35;margin:0 6px}
@media (max-width:760px){
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:40px}
  nav.tabs::-webkit-scrollbar{height:3px} nav.tabs::-webkit-scrollbar-thumb{background:var(--hdr-muted);border-radius:2px}
}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 7px;cursor:pointer;color:var(--hdr-muted);white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--hdr-ink);border-bottom-color:var(--hdr-accent)}
nav.tabs button:hover{color:var(--hdr-ink)}

main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
.lede{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px}
.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px}
:root{--edit-bg:rgba(46,160,87,.15);--edit-line:rgba(46,160,87,.6);--edit-acc:#2E9F57}
html[data-edit="yellow"]{--edit-bg:rgba(245,190,0,.22);--edit-line:rgba(205,150,0,.7);--edit-acc:#C99A00}
html[data-edit="blue"]{--edit-bg:rgba(40,120,220,.14);--edit-line:rgba(40,120,220,.55);--edit-acc:#2878DC}
html[data-edit="peach"]{--edit-bg:rgba(235,120,40,.15);--edit-line:rgba(215,100,30,.55);--edit-acc:#D7641E}
html[data-edit="off"]{--edit-bg:var(--sunk);--edit-line:var(--line);--edit-acc:var(--steel)}
.field input,.field select{width:100%;padding:7px 9px;border:1px solid var(--edit-line);border-radius:6px;background:var(--edit-bg)}
input[type=checkbox][data-b]{accent-color:var(--edit-acc);width:16px;height:16px}
.pval{display:none}
.editkey{font-size:.82rem;color:var(--muted);margin:-4px 0 12px;display:flex;align-items:center;gap:6px}
.editkey i{display:inline-block;width:24px;height:14px;background:var(--edit-bg);border:1px solid var(--edit-line);border-radius:3px}
.field .hint{font-size:.76rem;color:var(--muted);margin-top:2px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.btn.warn{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:.85rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--surface)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--sunk);position:sticky;top:0;font-size:.8rem}
td.l,th.l{text-align:left} td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:600;background:var(--sunk)}
table.inp td{padding:2px 3px}
table.inp input[type=number],table.inp input[type=text]{width:100%;min-width:76px;padding:5px 6px;border:1px solid var(--edit-line);border-radius:4px;background:var(--edit-bg);text-align:right}
table.inp input[type=text]{text-align:left;min-width:210px}
table.inp input[type=number]{-moz-appearance:textfield;appearance:textfield}
table.inp input[type=number]::-webkit-inner-spin-button,table.inp input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-skin])[data-edit="green"]{--edit-bg:rgba(60,190,105,.2)}}
html:root[data-skin="kiln-night"][data-edit="green"],html:root[data-skin="graphite-amber"][data-edit="green"]{--edit-bg:rgba(60,190,105,.2)}
table.inp input:hover{border-color:var(--edit-acc)} table.inp input:focus,.field input:focus,.field select:focus{border-color:var(--steel);outline:2px solid var(--steel);outline-offset:0}
table.inp select{padding:4px;border:1px solid var(--edit-line);border-radius:4px;background:var(--edit-bg)}
table.inp td{padding:3px 4px}
tr.off td{opacity:.5} tr.off td:first-child{opacity:1}
.sticky1{position:sticky;left:0;background:var(--surface);z-index:1}
th.sticky1{background:var(--sunk)}
.warn-cell{color:var(--bad);font-weight:600}

/* quality bands — signature element */
.bands{display:grid;gap:2px}
.band{display:grid;grid-template-columns:minmax(110px,170px) 1fr 92px;align-items:center;gap:12px;padding:7px 4px;border-bottom:1px dashed var(--line)}
.band:last-child{border-bottom:0}
.band .nm{font-weight:500}
.band .nm small{display:block;color:var(--muted);font-weight:400;font-size:.76rem}
.track{position:relative;height:26px;background:var(--sunk);border-radius:4px;border:1px solid var(--line)}
.track .zone{position:absolute;top:0;bottom:0;background:var(--band);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.track .zone.open-l{border-left:0} .track .zone.open-r{border-right:0}
.track .mk{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px;background:var(--steel)}
.track .mk.bind{background:var(--flame);box-shadow:0 0 0 3px var(--flame-soft)}
.track .mk.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.track .ghost{position:absolute;top:3px;bottom:3px;width:0;border-left:2px dotted var(--muted)}
.track .tk{position:absolute;bottom:-17px;font-size:.68rem;color:var(--muted);transform:translateX(-50%)}
.band .val{text-align:right;font:600 1.05rem var(--fh)}
.band .val small{display:block;font:400 .74rem var(--fb);color:var(--muted)}
.band.s-bind .val{color:var(--flame)} .band.s-low .val,.band.s-high .val{color:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}

/* status */
.banner{padding:10px 14px;border-radius:6px;margin-bottom:14px;border:1px solid}
.banner.ok{background:var(--ok-soft);border-color:var(--ok)} .banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.info{background:var(--steel-soft);border-color:var(--steel)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.76rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bind{background:var(--flame-soft);color:var(--flame)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.off{background:var(--sunk);color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:6px;padding:10px 14px}
.kpi.flame{border-left-color:var(--flame)} .kpi.ok{border-left-color:var(--ok)} .kpi.bad{border-left-color:var(--bad)}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font:600 1.6rem/1.15 var(--fh)}
.kpi .s{font-size:.78rem;color:var(--muted)}

/* bars */
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 84px;gap:10px;align-items:center;font-size:.86rem}
.hb .bar{height:18px;display:flex;background:var(--sunk);border-radius:3px;overflow:hidden}
.hb .bar span{display:block;height:100%}
.hb .n{text-align:right;font-weight:600}
.tor{display:grid;grid-template-columns:minmax(100px,170px) 1fr 1fr;gap:6px 0;align-items:center;font-size:.84rem}
.tor .l{padding-right:8px}
.tor .lh{display:flex;justify-content:flex-end;border-right:2px solid var(--ink)}
.tor .rh{display:flex;border-left:0}
.tor .lh span,.tor .rh span{height:16px;display:block}
.tor .lh span{background:var(--ok)} .tor .rh span{background:var(--bad)}
.tor em{font-style:normal;font-size:.74rem;color:var(--muted);padding:0 5px}

.scen-list{display:grid;gap:8px}
.scen{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.scen[aria-current="true"]{border-color:var(--steel);box-shadow:inset 3px 0 0 var(--steel)}
.scen .t{font-weight:600} .scen .d{font-size:.82rem;color:var(--muted)}
.scen .c{text-align:right;font:600 1.05rem var(--fh)}
.scen .c small{display:block;font:400 .74rem var(--fb);color:var(--muted)}

details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--surface);margin:10px 0}
summary{cursor:pointer;font-weight:600}
.note{font-size:.84rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:10px 0;max-width:80ch}
ul.tight{margin:.3rem 0;padding-left:1.2rem} ul.tight li{margin:.25rem 0}

/* report */
.cons .cover{padding:10px 0 20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.cons .toc ol{columns:2;margin:.4rem 0 1rem;padding-left:1.3rem}
.cons h4{margin:1rem 0 .4rem;font-size:.98rem}
.cons .headline{font-size:1.12rem}
table.kv td{text-align:left;white-space:normal} table.kv td:first-child{color:var(--muted);width:38%}
td.wrap{white-space:normal;min-width:220px;max-width:460px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 28px;max-width:1000px}
.rhead{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid var(--steel);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap}
.rhead h2{font-size:1.5rem}
.rhead .meta{font-size:.82rem;color:var(--muted);text-align:right}
.report h3{border-bottom:1px solid var(--line);padding-bottom:3px}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;font-size:.84rem;color:var(--muted)}
.sign div{border-top:1px solid var(--muted);padding-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---- header vars (defaults) ---- */
:root{--hdr-bg:var(--surface);--hdr-ink:var(--ink);--hdr-muted:var(--muted);--hdr-accent:var(--flame);--hdr-icon:var(--steel)}
/* ---- 10 skins (override host light/dark) ---- */
html:root[data-skin="limestone"]{--bg:#ECEEEA;--surface:#FFFFFF;--sunk:#F5F6F3;--ink:#1B2630;--muted:#5A6670;--line:#D2D7D2;--steel:#245B7A;--steel-soft:#DCE8EF;--flame:#B8620F;--flame-soft:#F6E3CF;--ok:#2C7A4B;--ok-soft:#DCEFE3;--bad:#A93A2C;--bad-soft:#F6DEDA;--band:#CFE0D6;color-scheme:light;--hdr-bg:#FFFFFF;--hdr-ink:#1B2630;--hdr-muted:#5A6670;--hdr-accent:#B8620F;--hdr-icon:#245B7A}
html:root[data-skin="kiln-night"]{--bg:#141A1F;--surface:#1C242B;--sunk:#182026;--ink:#E4E9E6;--muted:#97A3AB;--line:#2D3940;--steel:#7DB3D3;--steel-soft:#21384A;--flame:#E39A52;--flame-soft:#3D2C1C;--ok:#6CC08F;--ok-soft:#1E3A2A;--bad:#E58A7C;--bad-soft:#41241F;--band:#2A4536;color-scheme:dark;--hdr-bg:#1C242B;--hdr-ink:#E4E9E6;--hdr-muted:#97A3AB;--hdr-accent:#E39A52;--hdr-icon:#7DB3D3}
html:root[data-skin="corporate-navy"]{--bg:#F1F3F7;--surface:#FFFFFF;--sunk:#F6F7FA;--ink:#14213D;--muted:#58627A;--line:#D5DAE4;--steel:#1F4E79;--steel-soft:#DDE7F2;--flame:#C78A12;--flame-soft:#F6EBD2;--ok:#2B7A50;--ok-soft:#DCEFE4;--bad:#B23A30;--bad-soft:#F6DDDA;--band:#D3E2DA;color-scheme:light;--hdr-bg:#13294B;--hdr-ink:#FFFFFF;--hdr-muted:#AEBBD3;--hdr-accent:#E2A93B;--hdr-icon:#FFFFFF}
html:root[data-skin="graphite-amber"]{--bg:#17191B;--surface:#212427;--sunk:#1B1E20;--ink:#ECECEA;--muted:#A3A7A9;--line:#33383C;--steel:#9CC3E0;--steel-soft:#22303B;--flame:#F2A33A;--flame-soft:#3A2E1E;--ok:#7CC48F;--ok-soft:#203A28;--bad:#EE8A7A;--bad-soft:#43231E;--band:#2C3A2F;color-scheme:dark;--hdr-bg:#0F1011;--hdr-ink:#F5F5F3;--hdr-muted:#9EA2A4;--hdr-accent:#F2A33A;--hdr-icon:#F2A33A}
html:root[data-skin="cement-grey"]{--bg:#E9E9E7;--surface:#FAFAF9;--sunk:#F1F1EF;--ink:#262829;--muted:#66696B;--line:#CFD0CE;--steel:#3E4A54;--steel-soft:#DEE2E5;--flame:#806B4F;--flame-soft:#EDE6DB;--ok:#3D7356;--ok-soft:#DCEAE1;--bad:#9C3B31;--bad-soft:#F1DDDA;--band:#D6DED8;color-scheme:light;--hdr-bg:#4A4F53;--hdr-ink:#FFFFFF;--hdr-muted:#C9CCCE;--hdr-accent:#D9C9AE;--hdr-icon:#FFFFFF}
html:root[data-skin="safety-yellow"]{--bg:#F3F2EC;--surface:#FFFFFF;--sunk:#F8F7F2;--ink:#1A1A1A;--muted:#5E5E58;--line:#D9D7CC;--steel:#262626;--steel-soft:#E9E8E2;--flame:#C99A00;--flame-soft:#FBEFC2;--ok:#2E7D32;--ok-soft:#DDEFDD;--bad:#C62828;--bad-soft:#F8DCDC;--band:#F3E7B2;color-scheme:light;--hdr-bg:#1A1A1A;--hdr-ink:#FFFFFF;--hdr-muted:#BDBDB5;--hdr-accent:#F5C400;--hdr-icon:#F5C400}
html:root[data-skin="green-sustain"]{--bg:#EDF2EE;--surface:#FFFFFF;--sunk:#F4F8F5;--ink:#1C2B23;--muted:#56665C;--line:#D0DCD3;--steel:#2D6A4F;--steel-soft:#D8EBDF;--flame:#B9772A;--flame-soft:#F4E6D2;--ok:#2D6A4F;--ok-soft:#D8EBDF;--bad:#A8432F;--bad-soft:#F4DEDA;--band:#CBE3D3;color-scheme:light;--hdr-bg:#1E4D3A;--hdr-ink:#FFFFFF;--hdr-muted:#B3CFBF;--hdr-accent:#E6B55C;--hdr-icon:#FFFFFF}
html:root[data-skin="executive-slate"]{--bg:#F2F3F5;--surface:#FFFFFF;--sunk:#F7F8F9;--ink:#1E2430;--muted:#5D6573;--line:#D7DAE0;--steel:#34466B;--steel-soft:#DEE3EE;--flame:#A9823A;--flame-soft:#F2E9D6;--ok:#2F7552;--ok-soft:#DDEDE4;--bad:#A63D33;--bad-soft:#F3DEDB;--band:#D4E1DA;color-scheme:light;--hdr-bg:#232B3A;--hdr-ink:#F5F1E6;--hdr-muted:#AEB4C2;--hdr-accent:#C9A55A;--hdr-icon:#C9A55A}
html:root[data-skin="oxide-red"]{--bg:#F2EEED;--surface:#FFFFFF;--sunk:#F8F5F4;--ink:#2A1C1A;--muted:#6B5D5A;--line:#DED3D0;--steel:#8C2E22;--steel-soft:#F2DDD9;--flame:#C17A27;--flame-soft:#F5E7D3;--ok:#2F7550;--ok-soft:#DDEDE3;--bad:#B0261A;--bad-soft:#F6D9D5;--band:#D9E3D8;color-scheme:light;--hdr-bg:#561C16;--hdr-ink:#FFFFFF;--hdr-muted:#D8B6B0;--hdr-accent:#E9A65A;--hdr-icon:#FFFFFF}

<script>
/* ===== Engine: data model, chemistry, LP (two-phase simplex), elastic feasibility ===== */
const OX = ['SiO2','Al2O3','Fe2O3','CaO','MgO','SO3','K2O','Na2O','TiO2','Mn2O3','P2O5','Cl'];
const ASHOX = OX.filter(o => o !== 'SO3');
const OXL = {SiO2:'SiO₂',Al2O3:'Al₂O₃',Fe2O3:'Fe₂O₃',CaO:'CaO',MgO:'MgO',SO3:'SO₃',K2O:'K₂O',Na2O:'Na₂O',TiO2:'TiO₂',Mn2O3:'Mn₂O₃',P2O5:'P₂O₅',Cl:'Cl',LOI:'LOI'};

function uid(){ return Math.random().toString(36).slice(2,9); }
function num(v, d){ const n = parseFloat(v); return isFinite(n) ? n : (d === undefined ? 0 : d); }
function blank(v){ return v === '' || v === null || v === undefined || !isFinite(parseFloat(v)); }

function sampleState(){
  const raw = (name,type,price,moist,c) => ({id:uid(),name,type,on:true,price,moist,min:'',max:'',avail:'',chem:c});
  const ch = a => { const o={}; ['SiO2','Al2O3','Fe2O3','CaO','MgO','SO3','K2O','Na2O','TiO2','Mn2O3','P2O5','Cl','LOI'].forEach((k,i)=>o[k]=a[i]||0); return o; };
  const fuel = (name,on,price,cv,ash,S,tm,im,ef,bio,a) => { const o={}; ASHOX.forEach((k,i)=>o[k]=a[i]||0);
    return {id:uid(),name,on,price,cv,ash,S,tm,im,ef,bio,min:0,max:100,avail:'',ashChem:o}; };
  const raws = [
    raw('PIT-1 EMR03/N4E4 low grade','Limestone',150,5,ch([15.23,2.28,2.70,41.74,1.12,0.10,0.63,0.10,0.11,0.03,0.03,0.014,34.20])),
    raw('PIT-2 EMR02/N5E5 high grade','Limestone',150,5,ch([10.46,2.23,1.90,45.98,1.09,0.10,0.64,0.11,0.20,0.05,0.05,0.006,36.80])),
    raw('Bauxite Katni','Corrective',2500,10,ch([20.00,45.00,10.00,0.30,0.10,0.10,0.02,0.01,0,0,0,0,20.34])),
    raw('Flue dust','Corrective',1500,10,ch([8.18,4.34,43.35,2.22,1.01,0.01,0.46,0.02,0.23,0.08,0.14,0.005,36.23])),
    raw('Bauxite-2 Ranchi','Corrective',3500,10,ch([5.00,50.00,10.00,0.50,0.60,0,0.50,0.20,8.80,0,0,0,22.80])),
  ];
  // ash oxides order: SiO2 Al2O3 Fe2O3 CaO MgO K2O Na2O TiO2 Mn2O3 P2O5 Cl
  const fuels = [
    fuel('Imported coal',true,7500,6000,18,0.54,8,2.5,94.6,false,[52.77,30.94,5.10,5.39,1.01,0.42,0.16]),
    fuel('Indian coal',true,5500,3900,34,1.20,10,2.5,96.1,false,[58.00,21.52,10.00,4.00,0.68,0.25,0.25]),
    fuel('Petcoke',true,8000,8200,2,7.00,6,2.5,97.5,false,[40.00,23.40,21.00,8.38,0]),
    fuel('High sulphur imported coal',true,7500,6000,18,2.50,8,2.5,94.6,false,[52.77,30.94,5.10,5.39,1.01,0.42,0.16]),
    fuel('A01',false,0,4550,32.1,0.68,14,3.6,96.1,false,[60.52,21.52,11.83,1.24,0.38,0,0,1.56,0.12,0.17]),
    fuel('Indonesian coal',false,0,4200,10,0.19,18,2.5,96.1,false,[46.16,23.17,25.25,1.78,1.80,0.09,0.13]),
    fuel('Pruned biomass',false,0,3000,25,0,15,1,0,true,[]),
  ];
  const F = n => fuels.find(f=>f.name===n).id;
  const only = (...pairs) => { const o={}; fuels.forEach(f=>o[f.id]={min:0,max:0}); for(let i=0;i<pairs.length;i+=3) o[F(pairs[i])]={min:pairs[i+1],max:pairs[i+2]}; return o; };

      let pc = -1, best = -EPS; const bland = it > 300;
      for(let j=0;j<N;j++){ if (blocked[j]) continue; if (z[j] < best){ pc=j; if (bland) break; best = z[j]; } }
      if (pc < 0) return {ok:true, z};
      let pr = -1, br = Infinity;
      for(let i=0;i<m;i++){ if (T[i][pc] > EPS){ const q = T[i][N]/T[i][pc]; if (q < br-1e-12 || (Math.abs(q-br)<=1e-12 && basis[i] < basis[pr])){ br=q; pr=i; } } }
      if (pr < 0) return {ok:false, unbounded:true};
      pivot(pr, pc, z);
    }
    return {ok:false, iter:true};
  };
  const noBlock = new Array(N).fill(false);
  if (nA){
    const c1 = new Array(N).fill(0); for(let j=0;j<N;j++) if(isArt[j]) c1[j]=1;
    const p1 = run(c1, noBlock); if(!p1.ok) return {status:'error'};
    let w = 0; for(let i=0;i<m;i++) if(isArt[basis[i]]) w += T[i][N];
    if (w > 1e-7) return {status:'infeasible', infeas:w};
    for(let i=0;i<m;i++) if(isArt[basis[i]]){ for(let j=0;j<n+nS;j++) if(Math.abs(T[i][j])>1e-9){ pivot(i,j,new Array(N+1).fill(0)); break; } }
  }
  const c2 = new Array(N).fill(0); for(let j=0;j<n;j++) c2[j]=c[j];
  const p2 = run(c2, isArt); if(!p2.ok) return {status: p2.unbounded?'unbounded':'error'};
  const x = new Array(n).fill(0); for(let i=0;i<m;i++) if(basis[i]<n) x[basis[i]] = T[i][N];
  return {status:'optimal', x, obj: x.reduce((s,v,j)=>s+v*c[j],0), iters:ITER};
}

/* ---- Evaluate a mix: x by id {rawId:t/tclk, fuelId:t/tclk} ---- */
function evaluate(st, sc, xr, xf, xfc){
  const P = st.plant, tpd = num(P.tpd), days = num(P.days), defs = paramDefs(P);
  const dustF = 100/(100-Math.min(num(P.dust),90));
  const raws = st.raws.filter(r=>(xr[r.id]||0)>1e-9), fuels = st.fuels.filter(f=>(xf[f.id]||0)>1e-9);
  let mass = 0; const clk = {}; OX.forEach(k=>clk[k]=0); const kfSum = {}; OX.concat('LOI').forEach(k=>kfSum[k]=0);
  let rTot = 0, fTot = 0, heatIn = 0, bioHeat = 0, ashIn = 0, sIn = 0, co2p = 0, co2f = 0, co2bio = 0;
  const rawRows = raws.map(r => { const t = xr[r.id], c = rawCoef(st, r); rTot += t; mass += t*c.mass; co2p += t*c.co2;
    OX.forEach(k=>clk[k]+=t*c.ox[k]); OX.concat('LOI').forEach(k=>kfSum[k]+=t*num(r.chem[k]));
    return {id:r.id, name:r.name, type:r.type, t, cost:t*c.cost, price:num(r.price), moist:num(r.moist),
      tpdDry:t*tpd*dustF, tpdWet:t*tpd*dustF*100/(100-num(r.moist))}; });
  const fuelRows = fuels.map(f => { const t = xf[f.id], c = fuelCoef(st, f); fTot += t; mass += t*c.mass;
    OX.forEach(k=>clk[k]+=t*(c.ox[k]||0)); heatIn += t*c.heat; if (f.bio) { bioHeat += t*c.heat; co2bio += t*num(f.cv)*4.1868e-6*num(f.ef); }
    ashIn += t*num(f.ash)/100; sIn += t*num(f.S)/100; co2f += t*c.co2;
    return {id:f.id, name:f.name, t, cost:t*c.cost, price:num(f.price), cv:num(f.cv), ash:num(f.ash), S:num(f.S), bio:f.bio,
      tpdAF:t*tpd, tpdAR:t*tpd*c.arF, heat:t*c.heat}; });
  OX.forEach(k=>clk[k] = mass>0 ? clk[k]/mass : 0);
  const kf = {}; OX.concat('LOI').forEach(k=>kf[k] = rTot>0 ? kfSum[k]/rTot : 0);
  rawRows.forEach(r=>{ r.pct = r.t/rTot*100; }); const wetTot = rawRows.reduce((s,r)=>s+r.tpdWet,0); rawRows.forEach(r=>r.pctWet = r.tpdWet/wetTot*100);
  fuelRows.forEach(f=>{ f.pct = f.t/fTot*100; f.heatPct = heatIn>0 ? f.heat/heatIn*100 : 0; });
  const vals = {}; defs.forEach(d => vals[d.k] = evalParam(d, clk, kf));
  const kfm = {LSF:evalParam(defs[0],kf,kf), SM:kf.SiO2/(kf.Al2O3+kf.Fe2O3), AM:kf.Al2O3/kf.Fe2O3};
  const rawCost = rawRows.reduce((s,r)=>s+r.cost,0)/mass, fuelCost = fuelRows.reduce((s,f)=>s+f.cost,0)/mass;
  rawRows.forEach(r=>r.cost/=mass); fuelRows.forEach(f=>f.cost/=mass);
  const lims = effLimits(st, sc).map(L => { const v = vals[L.d.k]; let status = 'off';
    if (L.on){ const tol = 1e-3*Math.max(1, Math.abs(L.lo??L.hi??1));
      status = 'ok';
      if (L.lo!==null && v < L.lo - tol) status = 'low'; else if (L.hi!==null && v > L.hi + tol) status = 'high';
      else if ((L.lo!==null && Math.abs(v-L.lo)<=tol) || (L.hi!==null && Math.abs(v-L.hi)<=tol)) status = 'bind'; }
    return {k:L.d.k, d:L.d, on:L.on, lo:L.lo, hi:L.hi, v, status}; });
  const total = rawCost + fuelCost;
  let pile = null;
  { const ls = rawRows.filter(r => { const m = st.raws.find(z=>z.id===r.id); return m && isLS(m); });
    const tot = ls.reduce((s,r)=>s+r.t,0);
    if (tot > 0){ const ch = {}; OX.concat('LOI').forEach(k=>ch[k]=0); let mo = 0;
      ls.forEach(r => { const m = st.raws.find(z=>z.id===r.id); OX.concat('LOI').forEach(k=>ch[k]+=r.t/tot*num(m.chem[k])); mo += r.t/tot*num(m.moist); });
      const vals = {}; PILE_DEFS.forEach(d=>vals[d.k]=pileEval(d, ch));
      const lims = pileLimits(st, sc).map(L => { const v = vals[L.d.k]; let status = 'off';
        if (L.on){ const tol = 1e-3*Math.max(1, Math.abs(L.lo ?? L.hi ?? 1)); status = 'ok';
          if (L.lo!==null && v < L.lo - tol) status = 'low'; else if (L.hi!==null && v > L.hi + tol) status = 'high';
          else if ((L.lo!==null && Math.abs(v-L.lo)<=tol) || (L.hi!==null && Math.abs(v-L.hi)<=tol)) status = 'bind'; }
        return {k:L.d.k, d:L.d, on:L.on, lo:L.lo, hi:L.hi, v, status}; });
      const rawTot = rawRows.reduce((s,r)=>s+r.t,0);
      pile = {rows: ls.map(r => ({id:r.id, name:r.name, pct:r.t/tot*100, tpdDry:r.tpdDry, tpdWet:r.tpdWet})), chem:ch, vals, lims, moist:mo,
        tpdDry: ls.reduce((s,r)=>s+r.tpdDry,0), tpdWet: ls.reduce((s,r)=>s+r.tpdWet,0), share: rawTot>0 ? tot/rawTot*100 : 0}; } }
  let circuits = null;
  if (xfc){ circuits = {};
    ['K','P'].forEach(cc => { const m = xfc[cc] || {}; let ht = 0, tt = 0, ash = 0, S = 0, cost = 0;
      const rows = st.fuels.filter(f=>(m[f.id]||0)>1e-9).map(f => { const t = m[f.id], c = fuelCoef(st, f); ht += t*c.heat; tt += t; ash += t*num(f.ash)/100; S += t*num(f.S)/100; cost += t*c.cost;
        return {id:f.id, name:f.name, t, heat:t*c.heat, cost:t*c.cost/mass, tpdAF:t*tpd, tpdAR:t*tpd*c.arF, price:num(f.price), cv:num(f.cv)}; });
      rows.forEach(r=>{ r.pct = tt>0 ? r.t/tt*100 : 0; r.heatPct = ht>0 ? r.heat/ht*100 : 0; });
      circuits[cc] = {name:CIRC[cc], rows, heat:ht/mass, heatShare: heatIn>0 ? ht/heatIn*100 : 0, fuelPerClk:tt/mass, mixCV: tt>0 ? ht/tt : 0, ash: tt>0 ? ash/tt*100 : 0, S: tt>0 ? S/tt*100 : 0, cost:cost/mass, ashAbs: ash/mass*100}; }); }
  return { pile, circuits,
    mass, clk, kf, kfm, vals, lims, rawRows, fuelRows,
    rawMealFactor: rTot*dustF/mass, fuelPerClk: fTot/mass, heat: heatIn/mass,
    mixCV: fTot>0 ? heatIn/fTot : 0, mixAsh: fTot>0 ? ashIn/fTot*100 : 0, mixS: fTot>0 ? sIn/fTot*100 : 0,
    ashAbs: ashIn/mass*100, tsr: heatIn>0 ? bioHeat/heatIn*100 : 0,
    rawCost, fuelCost, total, perDay: total*tpd, perYearCr: total*tpd*days/1e7,
    co2Process: co2p/mass, co2Fuel: co2f/mass, co2Bio: co2bio/mass, co2: (co2p+co2f)/mass,
    hor: 4.11*clk.Al2O3 + 6.48*clk.MgO + 7.646*clk.CaO - 5.116*clk.SiO2 - 0.59*clk.Fe2O3,
    mbzt: 1300 + 4.51*vals.C3S - 3.74*vals.C3A - 12.64*vals.C4AF,
    bi: vals.C3S/(vals.C3A+vals.C4AF),
    feasible: lims.every(l => l.status!=='low' && l.status!=='high'),
  };
}

/* ---- Optimise one scenario ---- */
function optimise(st, sc, opt){
  const M = buildModel(st, sc, opt);
  if (!M.n) return {status:'empty', msg:'No raw materials or fuels are switched on for this scenario.'};
  if (!M.vars.some(v=>v.t==='f')) return {status:'empty', msg:'No fuel is allowed in this scenario. Give at least one fuel a max share above 0.'};
  if (M.dual) for (const [cc,sp] of [['K',M.ks],['P',1-M.ks]]) if (sp > 0 && !M.vars.some(v=>v.t==='f'&&v.circ===cc)) return {status:'empty', msg:`No fuel is allowed in the ${CIRC[cc]} for this scenario, but it takes ${(sp*100).toFixed(0)}% of the heat. Allow at least one fuel there.`};
  const T0 = (typeof performance!=='undefined'?performance.now():Date.now());
  const sol = simplex(M.obj, M.rows);
  const ms = () => (typeof performance!=='undefined'?performance.now():Date.now()) - T0;
  const toMaps = x => { const xr={}, xf={}, xfc = M.dual ? {K:{},P:{}} : null;
    M.vars.forEach((v,i)=>{ if (v.t==='r') xr[v.m.id]=x[i]; else { xf[v.m.id]=(xf[v.m.id]||0)+x[i]; if (xfc) xfc[v.circ][v.m.id]=(xfc[v.circ][v.m.id]||0)+x[i]; } }); return {xr,xf,xfc}; };
  if (sol.status === 'optimal'){
    const {xr,xf,xfc} = toMaps(sol.x); const ev = evaluate(st, sc, xr, xf, xfc);
    return {status:'optimal', x:sol.x, xr, xf, xfc, ev, model:M, iters:sol.iters, ms:ms(), method:'Two-phase simplex (LP)'};
  }
  // Is quality achievable at all with these materials and fuels (ignoring stock, mix and share limits)?
  const isQ = r => r.tag.kind === 'q';
  const sq = simplex(M.obj, M.rows.filter(r => r.tag.hard || isQ(r)));
  const qualityOK = sq.status === 'optimal';
  const priority = st.plant.priority === 'balanced' ? 'balanced' : 'quality';
  // elastic programming with priorities
  let soft, weight;
  if (qualityOK && priority === 'quality'){ soft = M.rows.map((r,i)=>(!r.tag.hard && !isQ(r)) ? i : -1).filter(i=>i>=0); weight = () => 1; }
  else { soft = M.rows.map((r,i)=>!r.tag.hard ? i : -1).filter(i=>i>=0); weight = i => (!qualityOK && !isQ(M.rows[i])) ? 50 : 1; }
  const rows2 = M.rows.map((r,i) => { const a = r.a.concat(new Array(soft.length).fill(0)); const k = soft.indexOf(i);
    if (k >= 0){ if (r.op==='>=') a[M.n+k]=1; else if (r.op==='<=') a[M.n+k]=-1; else a[M.n+k]=1; }
    return {a, op:r.op, b:r.b}; });
  const cmax = Math.max(...M.obj.map(Math.abs), 1);
  const obj2 = M.obj.map(c=>c/cmax*1e-6).concat(soft.map(i=>weight(i)));
  const sol2 = simplex(obj2, rows2);
  if (sol2.status !== 'optimal') return {status:'infeasible', msg:'No mix can satisfy the clinker mass and heat balance. Check fuel CVs, ash and LOI values.', fixes:[], viol:[]};
  const x = sol2.x.slice(0, M.n); const {xr,xf,xfc} = toMaps(x); const ev = evaluate(st, sc, xr, xf, xfc);
  const viol = soft.map((ri,k)=>({tag:M.rows[ri].tag, s:sol2.x[M.n+k]})).filter(v=>v.s>1e-7).map(v=>v.tag);
  // single-change diagnosis: drop one limit group at a time and re-solve
  const groups = {};
  M.rows.forEach((r,i) => { if (r.tag.hard) return; const g = r.tag.kind==='q' ? 'q:'+r.tag.k : r.tag.kind.replace(/min|max/,'')+':'+r.tag.id+':'+(r.tag.circ||'');
    (groups[g] = groups[g] || {key:g, tag:r.tag, idx:[]}).idx.push(i); });
  const fixes = [];
  Object.values(groups).forEach(G => { const rows3 = M.rows.filter((r,i)=>!G.idx.includes(i)); const s3 = simplex(M.obj, rows3);
    if (s3.status === 'optimal'){ const mp = toMaps(s3.x); fixes.push({key:G.key, tag:G.tag, ev: evaluate(st, sc, mp.xr, mp.xf, mp.xfc)}); } });
  fixes.sort((a,b)=>a.ev.total-b.ev.total);
  const qMet = ev.lims.every(l => !l.on || (l.status !== 'low' && l.status !== 'high'));
  return {status:'infeasible', x, xr, xf, ev, viol, fixes, model:M, iters:sol2.iters, ms:ms(), method: qualityOK && priority==='quality' ? 'Elastic LP — quality held, other limits relaxed' : 'Elastic LP (least violation)', soft, slack:sol2.x.slice(M.n),
    qualityOK, qMet, priority,
    msg: qMet ? 'Every quality limit can be met, but only by going past the stock, mix or fuel-share limits listed below.' : qualityOK ? 'Quality can be met with these materials, but not within the other limits. The mix shown balances all limits.' : 'Quality cannot be met with these raw materials and fuels, even with unlimited stock. The mix shown is the closest achievable quality.'};
}

/* ---- Shadow prices: cost of each binding limit, by re-solving with that limit relaxed ---- */
function shadowPrices(st, sc, res){
  if (res.status !== 'optimal') return [];
  const base = res.ev.total, out = [];
  res.ev.lims.filter(l=>l.status==='bind').forEach(l => {
    const st2 = JSON.parse(JSON.stringify(st)); const sc2 = st2.scenarios.find(s=>s.id===sc.id) || JSON.parse(JSON.stringify(sc));
    sc2.limits = sc2.limits || {}; const o = sc2.limits[l.k] = Object.assign({}, sc2.limits[l.k]||{});
    o.on = 'on'; const step = l.d.step;
    const side = (l.lo!==null && Math.abs(l.v-l.lo) <= Math.abs((l.hi??Infinity)-l.v)) ? 'lo' : 'hi';
    o.lo = l.lo === null ? '' : (side==='lo' ? l.lo-step : l.lo); o.hi = l.hi === null ? '' : (side==='hi' ? l.hi+step : l.hi);
    const r2 = optimise(st2, sc2); const saving = r2.status==='optimal' ? base - r2.ev.total : 0;
    out.push({k:l.k, d:l.d, side, step, bound: side==='lo'?l.lo:l.hi, saving});
  });
  return out.sort((a,b)=>b.saving-a.saving);
}

/* ---- Price sensitivity (±pct) ---- */
function priceSensitivity(st, sc, res, pct){
  if (res.status !== 'optimal') return [];
  pct = pct || 10; const base = res.ev.total, out = [];
  const seen = new Set();
  res.model.vars.forEach(v => { if (num(v.m.price) <= 0 || seen.has(v.m.id)) return; seen.add(v.m.id);
    const lo = optimise(st, sc, {priceAdj:{[v.m.id]:1-pct/100}}), hi = optimise(st, sc, {priceAdj:{[v.m.id]:1+pct/100}});
    const costAt = r => r.status==='optimal' ? r.model.cost.reduce((s,c,i)=>s+c*r.x[i],0)/r.ev.mass : NaN;
    // costAt uses adjusted prices
    out.push({id:v.m.id, name:v.m.name, t:v.t, dn: costAt(lo)-base, up: costAt(hi)-base,
      used: (res.xr[v.m.id]||res.xf[v.m.id]||0) > 1e-9});
  });
  return out.sort((a,b)=>(Math.abs(b.up)+Math.abs(b.dn))-(Math.abs(a.up)+Math.abs(a.dn)));
}

/* ---- Current practice: convert % mix to per-tonne-clinker amounts ---- */
function evaluateCurrent(st){
  const cur = st.current, P = st.plant, heat = blank(cur.heat) ? num(P.heat) : num(cur.heat);
  const rs = st.raws.filter(r=>num(cur.raw[r.id])>0);
  const rSum = rs.reduce((s,r)=>s+num(cur.raw[r.id]),0); if (!rSum) return null;
  const blendTo = (mix, h) => { const fs = st.fuels.filter(f=>num(mix[f.id])>0), fSum = fs.reduce((s,f)=>s+num(mix[f.id]),0); if (!fSum) return null;
    const cv = fs.reduce((s,f)=>s+num(mix[f.id])/fSum*num(f.cv),0); if (cv<=0) return null; const o = {}; fs.forEach(f=>o[f.id] = h/cv*num(mix[f.id])/fSum); return o; };
  let xf = {}, xfc = null;
  if (isDual(st)){ const ks = kilnSplit(st, null);
    const k = blendTo(cur.fuelK||{}, heat*ks) || blendTo(cur.fuel||{}, heat*ks), p = blendTo(cur.fuelP||{}, heat*(1-ks)) || blendTo(cur.fuel||{}, heat*(1-ks));
    if ((ks>0 && !k) || (ks<1 && !p)) return null; xfc = {K:k||{}, P:p||{}};
    ['K','P'].forEach(cc=>Object.keys(xfc[cc]).forEach(id=>xf[id]=(xf[id]||0)+xfc[cc][id])); }
  else { xf = blendTo(cur.fuel||{}, heat); if (!xf) return null; }
  let fMass = 0; st.fuels.forEach(f=>{ if (xf[f.id]) fMass += xf[f.id]*fuelCoef(st,f).mass; });
  const lfPer = rs.reduce((s,r)=>s+num(cur.raw[r.id])/rSum*rawCoef(st,r).mass,0);
  const rTot = (1 - fMass)/lfPer; const xr = {}; rs.forEach(r=>xr[r.id] = rTot*num(cur.raw[r.id])/rSum);
  const scv = {id:'current', limits:{}, heat:cur.heat};
  return {status:'manual', xr, xf, xfc, ev: evaluate(st, scv, xr, xf, xfc)};
}


/* ===== UI ===== */
const LS = 'rmfco.v2';
let ST = loadState();
let RES = {}, CUR = null, DETAIL = {};
let TAB = 'results', REPORT = 'chemist', SHOWALL = false, DL = null;
const TABS = [['setup','Plant & basis'],['raws','Raw materials'],['pile','Limestone pile'],['fuels','Fuels'],['stock','Stock at site'],['limits','Quality limits'],['scen','Scenarios'],['solver','Solver'],['results','Optimum mix'],['compare','Compare'],['current','Current mix'],['reports','Reports'],['guide','User guide'],['ref','Formulas & reference']];

function loadState(){
  let local = null; try{ const s = localStorage.getItem(LS); if (s){ const o = JSON.parse(s); if (o && o.v === 2 && Array.isArray(o.raws)) local = o; } }catch(e){}
  const emb = window.__EMBED__;
  if (emb && emb.v === 2 && Array.isArray(emb.raws) && (!local || (emb.savedAt||0) > (local.savedAt||0))) { window.__USED_EMBED__ = true; return migrate(JSON.parse(JSON.stringify(emb))); }
  return local ? migrate(local) : sampleState();
}
function save(){ ST.savedAt = Date.now(); try{ localStorage.setItem(LS, JSON.stringify(ST)); }catch(e){} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IND = () => (ST.plant.numFmt || 'indian') === 'indian';
const BIGD = () => IND() ? 1e7 : 1e6, BU = () => IND() ? 'Cr' : 'M';
const SMD = () => IND() ? 1e5 : 1e3, SU = () => IND() ? 'L' : 'k', SUL = () => IND() ? 'lakh' : 'thousand';
const CS = () => ST.plant.currency || '₹';
const LOCZ = h => CS() === '₹' ? h : h.split('₹').join(CS());
const f = (v, d=1) => (v === null || v === undefined || !isFinite(v)) ? '–' : Number(v).toLocaleString(IND()?'en-IN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = (v, d=2) => { if (!isFinite(v)) return '–'; if (Math.abs(v) < 0.5*Math.pow(10,-d)) v = 0; return (v > 0 ? '+' : v < 0 ? '−' : '') + f(Math.abs(v), d); };
const sgnR = (v, d=2) => { if (!isFinite(v)) return '–'; if (Math.abs(v) < 0.5*Math.pow(10,-d)) v = 0; return (v > 0 ? '+' : v < 0 ? '−' : '') + '₹' + f(Math.abs(v), d); };
const scById = id => ST.scenarios.find(s => s.id === id);
const selSc = () => scById(ST.sel) || ST.scenarios[0];
const $ = s => document.querySelector(s);

function toast(msg){ const t = $('#toast'); t.textContent = LOCZ(msg); t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove('on'), 2600); }

/* ---- compute ---- */
function recompute(){
  const t0 = performance.now(); STALE = false;
  RES = {}; DETAIL = {};
  ST.scenarios.forEach(sc => { try{ RES[sc.id] = optimise(ST, sc); }catch(e){ RES[sc.id] = {status:'error', msg:String(e && e.message || e)}; } });
  try{ CUR = evaluateCurrent(ST); }catch(e){ CUR = null; }
  LASTSOLVE = {n:ST.scenarios.length, ms:performance.now()-t0, at:new Date()};
}
function detail(id){
  if (!DETAIL[id]){ const sc = scById(id), r = RES[id];
    DETAIL[id] = r && r.status === 'optimal' ? {shadow: shadowPrices(ST, sc, r), sens: priceSensitivity(ST, sc, r, 10)} : {shadow:[], sens:[]}; }
  return DETAIL[id];
}
function refInfo(){
  const ref = ST.plant.ref || '';
  if (ref === 'current') return CUR ? {name:'Current practice', ev:CUR.ev} : null;
  const id = ref.slice(2), sc = scById(id), r = RES[id];
  return sc && r && r.ev ? {name:sc.name, ev:r.ev, id} : null;
}
function savings(ev){
  const ref = refInfo(); if (!ref || !ev) return null;
  const k = num(ST.plant.tpd)*num(ST.plant.days)/BIGD();
  return {name:ref.name, raw:(ref.ev.rawCost-ev.rawCost)*k, fuel:(ref.ev.fuelCost-ev.fuelCost)*k, total:(ref.ev.total-ev.total)*k, perT: ref.ev.total-ev.total};
}
function bestScenario(){
  let best = null; ST.scenarios.forEach(sc => { const r = RES[sc.id]; if (r && r.status === 'optimal' && (!best || r.ev.total < best.r.ev.total)) best = {sc, r}; });

/* ---- quality band (signature) ---- */
function bandHTML(l, ghost){
  const d = l.d, v = l.v, lo = l.on ? l.lo : null, hi = l.on ? l.hi : null;
  const pts = [v]; if (lo!==null) pts.push(lo); if (hi!==null) pts.push(hi); if (isFinite(ghost)) pts.push(ghost);
  const good = pts.filter(isFinite); if (!good.length) return '';
  let mn = Math.min(...good), mx = Math.max(...good), span = mx - mn;
  if (span < 1e-9) span = Math.max(Math.abs(mx)*0.1, d.step*2);
  mn -= span*0.3; mx += span*0.3; const pos = x => Math.max(0, Math.min(100, (x-mn)/(mx-mn)*100));
  const st = l.on ? l.status : 'off';
  const zone = (lo!==null || hi!==null) ? `<div class="zone ${lo===null?'open-l':''} ${hi===null?'open-r':''}" style="left:${lo!==null?pos(lo):0}%;right:${hi!==null?100-pos(hi):0}%"></div>` : '';
  const ticks = (lo!==null?`<span class="tk" style="left:${pos(lo)}%">${f(lo,d.dec)}</span>`:'') + (hi!==null?`<span class="tk" style="left:${pos(hi)}%">${f(hi,d.dec)}</span>`:'');
  const mk = isFinite(v) ? `<div class="mk ${st==='bind'?'bind':(st==='low'||st==='high')?'bad':''}" style="left:${pos(v)}%" title="${esc(d.short)} ${f(v,d.dec)}"></div>` : '';
  const gh = isFinite(ghost) ? `<div class="ghost" style="left:${pos(ghost)}%" title="Reference ${f(ghost,d.dec)}"></div>` : '';
  return `<div class="band s-${st}"><div class="nm">${d.label}<small>${l.on?'Limit '+limTxt(l):'Not limited'}${d.unit?' · '+d.unit:''}</small></div>
    <div class="track">${zone}${gh}${mk}${ticks}</div><div class="val">${f(v,d.dec)}<small>${st==='bind'?'at limit':st==='ok'?'within':st==='off'?'free':'outside'}</small></div></div>`;
}

function shadowTable(sh, ev){
  const k = num(ST.plant.tpd)*num(ST.plant.days)/BIGD();
  if (!sh.length) return '<p class="muted">No quality limit is holding the cost up — the optimum sits inside every range.</p>';
  return `<div class="tw"><table><thead><tr><th class="l">Limit holding the cost</th><th>Current bound</th><th>If relaxed by</th><th>Saving ₹/t</th><th>Saving ₹${BU()}/yr</th></tr></thead><tbody>
  ${sh.map(s=>`<tr><td class="l">${s.d.label} ${s.side==='lo'?'minimum':'maximum'}</td><td>${f(s.bound,s.d.dec)}</td><td>${s.side==='lo'?'−':'+'}${f(s.step,s.d.dec)}</td><td>${f(s.saving,2)}</td><td>${f(s.saving*k,2)}</td></tr>`).join('')}

}

VIEWS.setup = () => {

  <div class="panel"><h3 style="margin-top:0">Theme</h3><p class="small muted">Saved on this device. Reports always print in a light layout.</p>${skinGallery()}
    <div class="fields" style="margin-top:14px"><div class="field"><label for="editsel">Input cell colour</label><select id="editsel" onchange="setEditColor(this.value)">${EDIT_OPTS.map(([k,l])=>`<option value="${k}" ${k===EDITC?'selected':''}>${l}</option>`).join('')}</select><div class="hint">Colour that marks every cell you can edit, like the green cells in the original workbook.</div></div></div></div>
  <div class="panel"><h3 style="margin-top:0">Font</h3><p class="small muted">Saved on this device and used in printed and downloaded reports.</p>

  <div class="panel"><h3 style="margin-top:0">Data</h3><p class="muted small">Inputs save automatically, but only in this browser and only for this copy of the app — a downloaded HTML file starts with its own empty storage. Use <b>Download app with my data</b> to get a single HTML file that opens with all your current inputs, stock and scenarios, or Export / Import data to move them between copies.</p>

    <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importFile(this)"></div>
  <details><summary>How the optimiser works</summary>
    <p>The workbook’s Excel Solver model is non-linear (fuel tonnage depends on the fuel mix). This app reformulates it exactly as a linear programme by working per tonne of clinker, then solves it with a two-phase simplex method, which always finds the true global minimum when one exists.</p>
    <ul class="tight small">
      <li><b>Decision variables</b>: tonnes of each raw material (dry) and each fuel (as fired) per tonne of clinker.</li>
      <li><b>Clinker balance</b>: Σ raw × (1 − LOI) + Σ fuel × (ash + 2.5 × S retained) = 1.</li>
      <li><b>Heat balance</b>: Σ fuel × CV = specific heat consumption.</li>
      <li><b>Quality limits</b>: oxides, Bogue phases and liquid are linear in the variables; ratio limits (LSF, SM, AM, ASR, kiln feed LSF) are rearranged to linear form, e.g. LSF ≥ L becomes 100·CaO − L·(2.8S + 1.18A + 0.65F) ≥ 0.</li>

    </ul></details>`;
};

function processWarnings(ev){
  const w = [], L = k => ev.lims.find(l=>l.k===k), v = ev.vals;
  const asr = L('ASR'); if (asr && !asr.on && isFinite(v.ASR) && (v.ASR < 0.8 || v.ASR > 1.2))
    w.push(`Alkali/sulphur ratio is ${f(v.ASR,2)} (usual window 0.8–1.2) and is not limited in this scenario — ${v.ASR<0.8?'excess sulphur raises build-up and ring risk in the preheater and kiln inlet':'excess alkali can raise clinker alkali and cycle volatiles'}. Consider applying the ASR limit.`);
  const so3 = L('SO3'); if (so3 && !so3.on && v.SO3 > 1.5) w.push(`Clinker SO₃ is ${f(v.SO3,2)}% and is not limited — check against your cement SO₃ budget.`);
  const cl = L('Cl'); if (cl && !cl.on && v.Cl > 0.03) w.push(`Clinker chloride is ${f(v.Cl,3)}% and is not limited — check bypass needs.`);
  return w;
}
function observations(sc, r){
  const out = [], k = num(ST.plant.tpd)*num(ST.plant.days)/BIGD(); if (!r || !r.ev) return out;
  const D = detail(sc.id), ev = r.ev;
  processWarnings(ev).forEach(x=>out.push(x));
  if (D.shadow[0] && D.shadow[0].saving > 0.05){ const s = D.shadow[0]; out.push(`${s.d.label} ${s.side==='lo'?'minimum':'maximum'} (${f(s.bound,s.d.dec)}) is the costliest limit: moving it by ${f(s.step,s.d.dec)} saves ₹${f(s.saving,2)}/t, about ₹${f(s.saving*k,2)} ${BU()} a year. Worth reviewing with QC if product quality allows.`); }
  const unused = ST.raws.filter(m=>m.on && !ev.rawRows.find(x=>x.id===m.id)).map(m=>m.name);
  if (unused.length) out.push(`Not selected at current prices and chemistry: ${unused.map(esc).join(', ')}.`);
  if (D.sens[0]){ const s = D.sens[0]; out.push(`Biggest cost driver: ${esc(s.name)} — a 10% price rise adds ₹${f(s.up,1)}/t (₹${f(s.up*k,2)} ${BU()}/yr).`); }
  ev.rawRows.concat(ev.fuelRows).forEach(x => { const m = ST.raws.find(z=>z.id===x.id) || ST.fuels.find(z=>z.id===x.id), av = m && availInfo(ST, sc, m); if (av && av.lim !== null && av.lim > 0){ const use = x.tpdWet ?? x.tpdAR, u = use/av.lim*100; if (u > 90) out.push(`${esc(m.name)} uses ${f(u,0)}% of what is available at site (${f(use,0)} of ${f(av.lim,0)} TPD${av.stock!==null?`; stock lasts ${f((av.stock+av.rcpt)/use,0)} days at this rate`:''}).`); } });
  const fs = ev.fuelCost/ev.total*100; out.push(`Fuel is ${f(fs,0)}% of clinkering cost; raw materials ${f(100-fs,0)}%.`);
  return out;
}

function rptTop(){

  if (cheapest3[1]) bullets.push(`Next best: ${esc(cheapest3[1].sc.name)} at ₹${f(cheapest3[1].r.ev.total,0)}/t, ₹${f((cheapest3[1].r.ev.total-ev.total)*k,2)} ${BU()}/yr dearer.`);

function recommendation(){
  const ok = ST.scenarios.map(sc=>({sc, r:RES[sc.id]})).filter(x=>x.r && x.r.status==='optimal').sort((a,b)=>a.r.ev.total-b.r.ev.total);
  if (!ok.length) return null;
  const cheapest = ok[0], clean = ok.find(x=>!processWarnings(x.r.ev).length), rec = clean || cheapest;
  let cond = null;
  if (cheapest !== rec){
    const sc2 = JSON.parse(JSON.stringify(cheapest.sc)); sc2.limits = sc2.limits || {}; const ev = cheapest.r.ev, flags = [];
    const g = k => ST.limits.find(l=>l.k===k) || {};
    if (ev.vals.ASR < 0.8 || ev.vals.ASR > 1.2){ sc2.limits.ASR = {on:'on', lo:blank(g('ASR').lo)?0.8:'', hi:blank(g('ASR').hi)?1.2:''}; flags.push('alkali/sulphur ratio'); }
    if (ev.vals.SO3 > 1.5){ sc2.limits.SO3 = {on:'on', lo:'', hi:blank(g('SO3').hi)?1.5:''}; flags.push('clinker SO₃'); }
    if (ev.vals.Cl > 0.03){ sc2.limits.Cl = {on:'on', lo:'', hi:blank(g('Cl').hi)?0.03:''}; flags.push('chloride'); }
    let fixed = null; try{ fixed = optimise(ST, sc2); }catch(e){}
    cond = {sc:cheapest.sc, r:cheapest.r, fixed, flags};
  }
  return {rec, cheapest, ok, cond};
}
function keyOxide(r){
  if (r.type === 'Limestone') return 'CaO';
  return ['Al2O3','Fe2O3','SiO2'].reduce((a,k)=>num(r.chem[k])>num(r.chem[a])?k:a,'Al2O3');
}

    <tr><td class="l">3. Adopt</td><td class="l">Month 2–3</td><td class="l wrap">Full changeover; update purchase plan and stock norms; issue revised setpoints.</td><td class="l wrap">Clinkering cost within ₹10/t of ₹${f(ev.total,0)}.</td></tr>
    <tr><td class="l">4. Sustain</td><td class="l">Monthly</td><td class="l wrap">Re-run with latest analyses and prices; review KPIs below in the monthly cost meeting.</td><td class="l wrap">Saving tracked against ₹${s?f(s.total,2):'–'} ${BU()}/yr.</td></tr></tbody></table></div>`;
  const tgt = kk => { const l = ev.lims.find(x=>x.k===kk); return l ? (l.on ? limTxt(l) : f(l.v,l.d.dec)) : '–'; };
  const kpi = `<div class="tw"><table><thead><tr><th class="l">KPI</th><th>Target</th><th class="l">Frequency</th><th class="l">Owner</th></tr></thead><tbody>
    ${[['Clinkering cost, ₹/t','≤ '+f(ev.total,0),'Monthly','Costing'],['Fuel on clinker, %',f(ev.fuelPerClk*100,2),'Daily','Process'],['Specific heat, kcal/kg','≤ '+f(ev.heat,0),'Daily','Process'],
      ['LSF',tgt('LSF'),'Hourly (raw meal) / 2-hourly (clinker)','QC'],['SM',tgt('SM'),'Hourly / 2-hourly','QC'],['AM',tgt('AM'),'Hourly / 2-hourly','QC'],['C₃S, %',tgt('C3S'),'Shift','QC'],
      ['Free lime, %','≤ '+f(num(P.freeLime),1),'2-hourly','QC'],['Alkali/sulphur ratio',ev.lims.find(l=>l.k==='ASR').on?tgt('ASR'):'0.8 – 1.2','Daily','QC'],['CO₂, kg/t clinker','≤ '+f(ev.co2*1000,0),'Monthly','Environment']]
      .map(r=>`<tr><td class="l">${r[0]}</td><td>${r[1]}</td><td class="l">${r[2]}</td><td class="l">${r[3]}</td></tr>`).join('')}</tbody></table></div>`;

  /* --- appendix --- */
  const defs = paramDefs(P);
  const limTable = `<div class="tw"><table><thead><tr><th class="l">Parameter</th><th class="l">Applied</th><th>Min</th><th>Max</th></tr></thead><tbody>${ST.limits.map(L=>{ const dd = defs.find(x=>x.k===L.k); return `<tr><td class="l">${dd.label}</td><td class="l">${L.on?'Yes':'No'}</td><td>${blank(L.lo)?'–':f(num(L.lo),dd.dec)}</td><td>${blank(L.hi)?'–':f(num(L.hi),dd.dec)}</td></tr>`; }).join('')}</tbody></table></div>`;
  const rawIn = `<div class="tw"><table><thead><tr><th class="l">Material</th><th>₹/t</th><th>Moist %</th>${OX.concat('LOI').map(o=>`<th>${OXL[o]}</th>`).join('')}</tr></thead><tbody>${ST.raws.filter(m=>m.on).map(m=>`<tr><td class="l">${esc(m.name)}</td><td>${f(num(m.price),0)}</td><td>${f(num(m.moist),1)}</td>${OX.concat('LOI').map(o=>`<td>${f(num(m.chem[o]),o==='Cl'?3:2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const fuelIn = `<div class="tw"><table><thead><tr><th class="l">Fuel</th><th>₹/t</th><th>CV</th><th>Ash %</th><th>S %</th><th>TM %</th><th>IM %</th><th>EF tCO₂/TJ</th>${ASHOX.slice(0,7).map(o=>`<th>Ash ${OXL[o]}</th>`).join('')}</tr></thead><tbody>${ST.fuels.filter(x=>x.on).map(x=>`<tr><td class="l">${esc(x.name)}</td><td>${f(num(x.price),0)}</td><td>${f(num(x.cv),0)}</td><td>${f(num(x.ash),1)}</td><td>${f(num(x.S),2)}</td><td>${f(num(x.tm),1)}</td><td>${f(num(x.im),1)}</td><td>${f(num(x.ef),1)}</td>${ASHOX.slice(0,7).map(o=>`<td>${f(num(x.ashChem[o]),2)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  const toc = ['Executive summary','Recommendations','Scope, basis and method','Raw material assessment','Fuel assessment','Baseline: current practice','Scenario analysis','Recommended mix: quality and process','Sensitivity and robustness','Environmental impact','Implementation roadmap','KPIs to monitor','Assumptions and limitations','Appendices'];
  const H = (i, extra) => `<h3 class="${extra||''}" id="c${i}">${i}. ${toc[i-1]}</h3>`;
  return `<div class="cons">${cover}
  <div class="toc"><b>Contents</b><ol>${toc.map(t=>`<li>${t}</li>`).join('')}</ol></div>
  ${H(1,'pb')}<p class="headline">Recommendation: adopt <b>${esc(rec.sc.name)}</b> — ₹${f(ev.total,0)} per tonne of clinker${s?`, ${s.total>=0?'saving':'adding'} <b>₹${f(Math.abs(s.total),1)} ${BU()} a year</b> against ${esc(s.name)}`:''}.</p>
  <div class="kpis"><div class="kpi ok"><div class="k">Annual saving</div><div class="v">${s?sgnR(s.total,1)+' '+BU():'–'}</div><div class="s">vs ${s?esc(s.name):'reference'}</div></div>
    <div class="kpi"><div class="k">Clinkering cost</div><div class="v">₹${f(ev.total,0)}/t</div><div class="s">raw ₹${f(ev.rawCost,0)} · fuel ₹${f(ev.fuelCost,0)}</div></div>
    <div class="kpi flame"><div class="k">Fuel</div><div class="v">${f(ev.fuelPerClk*100,1)}%</div><div class="s">${esc(ev.fuelRows.map(x=>x.name+' '+f(x.pct,0)+'%').join(', '))}</div></div>
    <div class="kpi"><div class="k">CO₂ intensity</div><div class="v">${f(ev.co2*1000,0)}</div><div class="s">kg/t clinker</div></div></div>
  <h4>Key findings</h4><ul class="tight">${findings.map(x=>`<li>${x}</li>`).join('')}</ul>
  ${H(2)}${recTable}
  ${H(3,'pb')}<p>The study compares ${ST.scenarios.length} fuel and raw mix scenarios for the kiln. For each, the optimiser chooses the proportions of every raw material and fuel that meet all applied clinker quality limits at the lowest cost.</p>
  <p>The plant’s Excel Solver model was non-linear, because fuel tonnage depends on the fuel blend. Here it is reformulated per tonne of clinker as an exact linear programme with clinker mass balance, heat balance, quality limits, mix limits and availability limits. It is solved by two-phase simplex, which guarantees the global optimum. Infeasible cases are diagnosed by elastic (goal) programming. Limit costs and price sensitivities come from re-solving the model.</p>${basis}
  ${H(4)}${rawAssess}<h4>Limestone pile for the recommended mix</h4>${pileTables(ev, true)}<p>${lsNote} The unit cost of the key oxide (dry basis) is the fair way to compare correctives: it shows what each tonne of Al₂O₃, Fe₂O₃ or SiO₂ actually costs delivered into the mix.</p>
  ${H(5)}<p>Fuels are ranked by cost of heat, which is the fair comparison when CVs differ. The 100% columns show what each fuel would do if fired alone at ${f(heat,0)} kcal/kg clinker.</p>${fuelAssess}
  <p>A cheap heat source is not automatically the cheapest overall. High-ash fuel puts silica and alumina into the clinker, which the raw mix must offset with more high-grade limestone. High-sulphur fuel shifts the alkali/sulphur balance. The scenario analysis captures both effects.</p>
  ${H(6)}${baseline}
  ${H(7,'pb')}${scenCmpTable()}<div class="panel" style="margin-top:12px">${scenarioBars()}</div>
  <h4>Interpretation</h4><ul class="tight">${interp}</ul>${infeasible.length?`<p>Not feasible with current limits: ${infeasible.map(x=>esc(x.name)).join(', ')}.</p>`:''}
  ${R.cond?`<div class="banner info"><b>${esc(R.cond.sc.name)}</b> has the lowest unconstrained cost (₹${f(R.cond.r.ev.total,0)}/t) but falls outside the ${R.cond.flags.join(' and ')} window. ${R.cond.fixed&&R.cond.fixed.status==='optimal'?`With that window applied the optimum is ₹${f(R.cond.fixed.ev.total,0)}/t using ${esc(R.cond.fixed.ev.fuelRows.map(x=>x.name+' '+f(x.pct,0)+'%').join(', '))}.`:'With that window applied, no feasible mix exists in this scenario.'}</div>`:''}
  ${H(8,'pb')}<p>Recommended mix (${esc(rec.sc.name)}) against each applied limit${curEv?'; the dotted line marks the current mix':''}.</p>
  ${bandsPanel(ev, curEv, 'Current mix')}
  <h4>Feeder and firing setpoints</h4>${rawTable(ev)}<div style="height:10px"></div>${fuelTable(ev)}
  <h4>Chemistry</h4>${chemTable(ev)}<h4>Phases and burnability</h4>${phaseTable(ev)}
  <h4>Stock at site</h4>${stockTable(rec.sc, ev)}
  <h4>Risk register</h4>${riskTable}
  ${H(9,'pb')}<h4>Cost of quality limits</h4>${shadowTable(D.shadow, ev)}<h4>Price sensitivity ±10%</h4>${tornado(D.sens)}<h4>Break-even prices</h4>${breakEven||'<p class="muted">Only one feasible scenario, so no break-even comparison.</p>'}
  ${H(10)}${envTable}<p>Process CO₂ comes from calcination of raw meal CaO and MgO (0.785 and 1.092 t CO₂ per t oxide); fuel CO₂ uses the IPCC emission factor on the entered CV. Biogenic CO₂ is excluded. ${cp>0?'':'No carbon price is set; enter one on the Plant &amp; basis tab to value emissions or optimise cost and carbon together under CCTS.'}</p>
  ${H(11,'pb')}${roadmap}
  ${H(12)}${kpi}
  ${H(13)}<ul class="tight">
    <li>Each material is represented by the single analysis entered; real variation will move the optimum.</li>
    <li>Prices are as received and held constant; freight and handling are assumed to be in the price.</li>
    <li>Specific heat consumption is fixed per scenario; fuel-dependent changes in kiln efficiency are not modelled.</li>
    <li>Fuel sulphur retention is ${f(num(P.sRet),0)}%; all fuel ash is assumed to enter the clinker.</li>
    <li>Bogue phases are potential composition; liquid uses the 1450 °C Lea–Parker form.</li>
    <li>Kiln dust is ${num(P.dust)>0?`treated as ${f(num(P.dust),1)}% lost`:'assumed fully returned'}.</li>
    <li>Capital, power and maintenance effects of fuel changes are outside scope.</li></ul>
  ${H(14,'pb')}<h4>A. Quality limits applied</h4>${limTable}<h4>B. Raw material data</h4>${rawIn}<h4>C. Fuel data</h4>${fuelIn}
  <h4>D. Formulas</h4><ul class="tight small"><li>LSF = 100·CaO / (2.8 SiO₂ + 1.18 Al₂O₃ + 0.65 Fe₂O₃); SM = SiO₂/(Al₂O₃+Fe₂O₃); AM = Al₂O₃/Fe₂O₃</li>
    <li>C₃S = 4.071(CaO − fCaO) − 7.6 SiO₂ − 6.718 Al₂O₃ − 1.43 Fe₂O₃${P.bogueSO3?' − 2.852 SO₃':''}; C₂S = 2.867 SiO₂ − 0.7544 C₃S; C₃A = 2.65 Al₂O₃ − 1.692 Fe₂O₃; C₄AF = 3.043 Fe₂O₃</li>
    <li>Liquid (1450 °C) = 3.0 Al₂O₃ + 2.25 Fe₂O₃ + MgO + K₂O + Na₂O; ASR = (K₂O/94.2 + Na₂O/62) / (SO₃/80)</li>
    <li>Fuel per t clinker = heat ÷ CV; clinker = Σ raw·(1−LOI) + Σ fuel·(ash + 2.5·S·retention)</li>
    <li>As fired → as received: × (100−IM)/(100−TM); dry → as received: × 100/(100−moisture)</li></ul>
  <div class="sign"><div>Prepared</div><div>Reviewed</div><div>Approved</div></div></div>`;
}

/* ---- CONSOLIDATED SCENARIO REPORT ---- */
function rptAll(){
  const pick = (printCfg().scen || []).filter(id => scById(id));
  const list = ST.scenarios.filter(sc => !pick.length || pick.includes(sc.id)).map(sc => ({sc, r:RES[sc.id]})).filter(x => x.r && x.r.ev);
  if (!list.length) return `${rHead('Scenario mix book','All scenarios')}<p>No scenario has results yet. Press Solve.</p>`;
  const single = list.length === 1;
  const ref = refInfo(), best = recommendation();
  const colH = list.map(x => `<th class="c">${esc(x.sc.name)}${best && best.rec.sc.id===x.sc.id ? ' ★' : ''}</th>`).join('');
  const stat = x => x.r.status==='optimal' ? '<span class="pill ok">Optimal</span>' : '<span class="pill bad">Infeasible</span>';
  const cellMark = l => !l || !l.on ? '' : (l.status==='low'||l.status==='high') ? 'warn-cell' : l.status==='bind' ? 'bindc' : '';
  // raw mix matrix
  const usedRaw = ST.raws.filter(m => list.some(x => x.r.ev.rawRows.find(z=>z.id===m.id)));
  const rawPct = (x, id) => (x.r.ev.rawRows.find(z=>z.id===id)||{}).pct;
  const rawTpd = (x, id) => (x.r.ev.rawRows.find(z=>z.id===id)||{}).tpdWet;
  const rawM = `<div class="tw"><table class="mx"><thead><tr><th class="l">Raw material, % dry</th>${colH}</tr></thead><tbody>
    ${usedRaw.map(m=>`<tr><td class="l">${esc(m.name)}</td>${list.map(x=>{ const v = rawPct(x,m.id); return `<td>${v?f(v,2):'–'}</td>`; }).join('')}</tr>`).join('')}
    <tr class="tot"><td class="l">Raw meal : clinker</td>${list.map(x=>`<td>${f(x.r.ev.rawMealFactor,3)}</td>`).join('')}</tr></tbody></table></div>`;
  const rawT = `<div class="tw"><table class="mx"><thead><tr><th class="l">Raw material, TPD as received</th>${colH}</tr></thead><tbody>
    ${usedRaw.map(m=>`<tr><td class="l">${esc(m.name)}</td>${list.map(x=>{ const v = rawTpd(x,m.id); return `<td>${v?f(v,0):'–'}</td>`; }).join('')}</tr>`).join('')}
    <tr class="tot"><td class="l">Total</td>${list.map(x=>`<td>${f(x.r.ev.rawRows.reduce((s,z)=>s+z.tpdWet,0),0)}</td>`).join('')}</tr></tbody></table></div>`;
  // fuel matrix
  const dual = list.some(x => x.r.ev.circuits);
  const usedFuel = ST.fuels.filter(m => list.some(x => x.r.ev.fuelRows.find(z=>z.id===m.id)));
  const fuelRowsFor = (lab, get) => usedFuel.map(m=>`<tr><td class="l">${lab}${esc(m.name)}</td>${list.map(x=>{ const v = get(x, m.id); return `<td>${v?f(v,1):'–'}</td>`; }).join('')}</tr>`).join('');
  const circPct = (cc) => (x, id) => x.r.ev.circuits ? (x.r.ev.circuits[cc].rows.find(z=>z.id===id)||{}).pct : null;
  const fuelM = `<div class="tw"><table class="mx"><thead><tr><th class="l">Fuel, % by mass</th>${colH}</tr></thead><tbody>
    ${dual ? `<tr class="sub"><td class="l" colspan="${list.length+1}">Kiln burner</td></tr>${fuelRowsFor('', circPct('K'))}<tr class="sub"><td class="l" colspan="${list.length+1}">Precalciner</td></tr>${fuelRowsFor('', circPct('P'))}<tr class="sub"><td class="l" colspan="${list.length+1}">Combined</td></tr>` : ''}
    ${fuelRowsFor('', (x,id)=>(x.r.ev.fuelRows.find(z=>z.id===id)||{}).pct)}
    <tr class="tot"><td class="l">Fuel on clinker, %</td>${list.map(x=>`<td>${f(x.r.ev.fuelPerClk*100,2)}</td>`).join('')}</tr>
    <tr class="tot"><td class="l">Mix CV, kcal/kg</td>${list.map(x=>`<td>${f(x.r.ev.mixCV,0)}</td>`).join('')}</tr>
    <tr class="tot"><td class="l">Specific heat, kcal/kg clk</td>${list.map(x=>`<td>${f(x.r.ev.heat,0)}</td>`).join('')}</tr>
    <tr class="tot"><td class="l">Fuel TPD as received</td>${list.map(x=>`<td>${f(x.r.ev.fuelRows.reduce((s,z)=>s+z.tpdAR,0),0)}</td>`).join('')}</tr></tbody></table></div>`;
  // quality matrix
  const qKeys = ['LSF','SM','AM','C3S','C2S','C3A','C4AF','LIQ','SiO2','Al2O3','Fe2O3','CaO','MgO','SO3','NAEQ','Cl','ASR'];
  const lim0 = list[0].r.ev.lims;
  const qM = `<div class="tw"><table class="mx"><thead><tr><th class="l">Clinker quality</th><th class="c">Limit (global)</th>${colH}</tr></thead><tbody>
    ${qKeys.map(k=>{ const L = lim0.find(l=>l.k===k); if (!L) return ''; return `<tr><td class="l">${L.d.label}</td><td class="c small">${L.on?limTxt(L):'–'}</td>${list.map(x=>{ const l = x.r.ev.lims.find(z=>z.k===k); return `<td class="${cellMark(l)}">${f(l.v,l.d.dec)}</td>`; }).join('')}</tr>`; }).join('')}
    <tr class="tot"><td class="l">Burnability index</td><td></td>${list.map(x=>`<td>${f(x.r.ev.bi,2)}</td>`).join('')}</tr>
    <tr class="tot"><td class="l">Result</td><td></td>${list.map(x=>`<td>${stat(x)}</td>`).join('')}</tr></tbody></table></div>
    <p class="small muted">Red = outside an applied limit; amber = on a limit (binding). Scenarios with their own limit overrides are checked against those; see each scenario page.</p>`;
  // cost matrix
  const sv = x => savings(x.r.ev);
  const costM = `<div class="tw"><table class="mx"><thead><tr><th class="l">Cost &amp; impact</th>${colH}</tr></thead><tbody>
    <tr><td class="l">Raw materials ₹/t clinker</td>${list.map(x=>`<td>${f(x.r.ev.rawCost,1)}</td>`).join('')}</tr>
    <tr><td class="l">Fuel ₹/t clinker</td>${list.map(x=>`<td>${f(x.r.ev.fuelCost,1)}</td>`).join('')}</tr>
    <tr class="tot"><td class="l">Clinkering cost ₹/t</td>${list.map(x=>`<td>${f(x.r.ev.total,1)}</td>`).join('')}</tr>
    <tr><td class="l">Cost per year ₹ ${BU()}</td>${list.map(x=>`<td>${f(x.r.ev.total*num(ST.plant.tpd)*num(ST.plant.days)/BIGD(),1)}</td>`).join('')}</tr>
    <tr class="tot"><td class="l">Saving vs ${ref?esc(ref.name):'reference'}, ₹ ${BU()}/yr</td>${list.map(x=>{ const s = sv(x); return `<td>${s?sgn(s.total,2):'–'}</td>`; }).join('')}</tr>
    <tr><td class="l">CO₂ kg/t clinker</td>${list.map(x=>`<td>${f(x.r.ev.co2*1000,0)}</td>`).join('')}</tr></tbody></table></div>`;
  // per scenario sections
  const per = list.map(({sc,r}) => { const ev = r.ev, s = savings(ev), warn = processWarnings(ev);
    const bad = ev.lims.filter(l=>l.on && (l.status==='low'||l.status==='high')), bind = ev.lims.filter(l=>l.on && l.status==='bind');
    return `<h3 class="pb">Scenario: ${esc(sc.name)}</h3>
    <p class="muted" style="margin-top:-4px">${esc(sc.desc||'')}${!blank(sc.heat)?` · specific heat ${f(num(sc.heat),0)} kcal/kg`:''}${ev.circuits?` · kiln ${f(ev.circuits.K.heatShare,0)}% / precalciner ${f(ev.circuits.P.heatShare,0)}% of heat`:''}</p>
    <div class="kpis">
      <div class="kpi ${r.status==='optimal'?'ok':'bad'}"><div class="k">Result</div><div class="v" style="font-size:1.15rem">${r.status==='optimal'?'Optimal':'Infeasible'}</div><div class="s">${r.status==='optimal'?'all applied limits met':esc(r.qMet?'quality met; stock/mix limit exceeded':'see limits below')}</div></div>
      <div class="kpi"><div class="k">Clinkering cost</div><div class="v">₹${f(ev.total,1)}</div><div class="s">raw ₹${f(ev.rawCost,1)} · fuel ₹${f(ev.fuelCost,1)}</div></div>
      <div class="kpi ${s&&s.total>=0?'ok':'flame'}"><div class="k">vs ${s?esc(s.name):'reference'}</div><div class="v">${s?sgnR(s.total,2)+' '+BU():'–'}</div><div class="s">per year</div></div>
      <div class="kpi"><div class="k">CO₂</div><div class="v">${f(ev.co2*1000,0)}</div><div class="s">kg/t clinker</div></div></div>
    <h4>Raw mix</h4>${rawTable(ev)}
    <h4>Limestone pile</h4>${pileTables(ev, true)}
    <h4>Fuel firing</h4>${fuelTable(ev)}
    <h4>Chemistry</h4>${chemTable(ev)}
    <h4>Quality check</h4><div class="tw"><table><thead><tr><th class="l">Parameter</th><th>Limit</th><th>Value</th><th class="l">Status</th></tr></thead><tbody>${ev.lims.filter(l=>l.on).map(l=>`<tr><td class="l">${l.d.label}</td><td>${limTxt(l)}</td><td>${f(l.v,l.d.dec)}</td><td class="l">${pill(l.status)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small">${bind.length?`Binding: ${bind.map(l=>l.d.short).join(', ')}. `:''}${bad.length?`<b>Outside limits:</b> ${bad.map(l=>`${l.d.short} ${f(l.v,l.d.dec)}`).join(', ')}. `:''}${warn.map(w=>w).join(' ')}</p>`; }).join('');
  if (single) return `${rHead('Scenario mix sheet', esc(list[0].sc.name))}
  <p>Scenario solved on a basis of ${f(num(ST.plant.tpd),0)} TPD clinker and ${f(num(ST.plant.days),0)} days per year.</p>
  ${per.replace('<h3 class="pb">','<h3>')}
  <div class="sign"><div>Prepared</div><div>Reviewed — Process HOD</div><div>Approved — Unit head</div></div>`;
  return `${rHead('Scenario mix book', list.length === ST.scenarios.length ? 'All scenarios consolidated' : list.length+' selected scenarios')}
  <p>${list.length} scenarios solved on a common basis of ${f(num(ST.plant.tpd),0)} TPD clinker, ${f(num(ST.plant.days),0)} days and ${f(num(ST.plant.heat),0)} kcal/kg (unless a scenario overrides it). ${best?`Recommended: <b>${esc(best.rec.sc.name)}</b> at ₹${f(best.rec.r.ev.total,1)}/t (★).`:''} Landscape paper suits the wide tables when there are many scenarios.</p>
  <h3>Cost summary</h3>${costM}<div class="panel" style="margin-top:10px">${scenarioBars()}</div>
  <h3>Raw mix by scenario</h3>${rawM}<h4>Daily raw material requirement</h4>${rawT}
  <h3>Limestone pile by scenario</h3>${pileMatrix(list)}
  <h3>Fuel mix by scenario</h3>${fuelM}
  <h3>Clinker quality by scenario</h3>${qM}
  ${per}
  <div class="sign"><div>Prepared</div><div>Reviewed — Process HOD</div><div>Approved — Unit head</div></div>`;
}

/* ---- ONE-PAGE EXCEL-STYLE SHEETS ---- */
function xsheet(sc, r){
  const ev = r.ev, s = savings(ev), P = ST.plant, k = num(P.tpd)*num(P.days)/BIGD(), d = new Date();
  const B = (t, inner, cls) => `<div class="xb ${cls||''}"><div class="xt">${t}</div>${inner}</div>`;
  const tbl = (head, rows, foot) => `<table class="xg"><thead><tr>${head.map((h,i)=>`<th class="${i?'':'l'}">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>${foot?`<tfoot>${foot}</tfoot>`:''}</table>`;
  const tr = (cells, cls) => `<tr class="${cls||''}">${cells.map((c,i)=>`<td class="${i?'':'l'}">${c}</td>`).join('')}</tr>`;
  // raw
  const rs = ev.rawRows, rt = rs.reduce((a,x)=>({p:a.p+x.pct,w:a.w+x.pctWet,d:a.d+x.tpdDry,a:a.a+x.tpdWet,c:a.c+x.cost}),{p:0,w:0,d:0,a:0,c:0});
  const raw = tbl(['Raw material','% dry','% AR','TPD dry','TPD AR','₹/t','₹/t clk'],
    rs.map(x=>tr([esc(x.name),f(x.pct,2),f(x.pctWet,2),f(x.tpdDry,0),f(x.tpdWet,0),f(x.price,0),f(x.cost,1)])).join(''),
    tr(['Total',f(rt.p,2),f(rt.w,2),f(rt.d,0),f(rt.a,0),'',f(rt.c,1)],'tot'));
  // fuel
  const frow = (x, c) => tr([esc(x.name)+(c?` <span class="xc">${c}</span>`:''),f(x.pct,1),f(x.heatPct,1),f(x.tpdAF,0),f(x.tpdAR,0),f(x.price,0),f(x.cost,1)]);
  let fRows = ev.circuits ? ['K','P'].map(cc=>ev.circuits[cc].rows.map(x=>frow(x, cc==='K'?'Kiln':'PC')).join('')).join('') : ev.fuelRows.map(x=>frow(x)).join('');
  const ft = ev.fuelRows.reduce((a,x)=>({af:a.af+x.tpdAF,ar:a.ar+x.tpdAR,c:a.c+x.cost}),{af:0,ar:0,c:0});
  const fuel = tbl(['Fuel','Mass %','Heat %','TPD AF','TPD AR','₹/t','₹/t clk'], fRows, tr(['Total','','',f(ft.af,0),f(ft.ar,0),'',f(ft.c,1)],'tot')) +
    `<table class="xg kv">${[['Specific heat, kcal/kg clk',f(ev.heat,0)],...(ev.circuits?[['Heat split kiln / PC, %',`${f(ev.circuits.K.heatShare,0)} / ${f(ev.circuits.P.heatShare,0)}`],['Kiln mix CV / PC mix CV',`${f(ev.circuits.K.mixCV,0)} / ${f(ev.circuits.P.mixCV,0)}`]]:[]),['Fuel on clinker, %',f(ev.fuelPerClk*100,2)],['Mix CV, kcal/kg · ash % · S %',`${f(ev.mixCV,0)} · ${f(ev.mixAsh,1)} · ${f(ev.mixS,2)}`],['Ash absorbed, % clk',f(ev.ashAbs,2)]].map(([a,b])=>tr([a,b])).join('')}</table>`;
  // cost
  const cost = `<table class="xg kv">${[['Raw materials, ₹/t clk',f(ev.rawCost,1)],['Fuel, ₹/t clk',f(ev.fuelCost,1)],['<b>Clinkering cost, ₹/t clk</b>',`<b>${f(ev.total,1)}</b>`],[`Per day, ₹ ${SUL()}`,f(ev.perDay/SMD(),2)],[`Per year, ₹ ${BU()}`,f(ev.total*k,2)],[`Saving vs ${s?esc(s.name):'ref'}, ₹ ${BU()}/yr`,s?sgn(s.total,2):'–'],['  raw / fuel',s?`${sgn(s.raw,2)} / ${sgn(s.fuel,2)}`:'–'],['CO₂, kg/t clk',f(ev.co2*1000,0)],['  process / fuel',`${f(ev.co2Process*1000,0)} / ${f(ev.co2Fuel*1000,0)}`]].map(([a,b])=>tr([a,b])).join('')}</table>`;
  // chemistry
  const chem = tbl(['Oxide %','Kiln feed','Clinker'], OX.concat('LOI').map(o=>tr([OXL[o],f(ev.kf[o],2),o==='LOI'?'–':f(ev.clk[o],o==='Cl'?3:2)])).join(''),
    [['LSF',ev.kfm.LSF,ev.vals.LSF,1],['SM',ev.kfm.SM,ev.vals.SM,2],['AM',ev.kfm.AM,ev.vals.AM,2]].map(([a,b,c,dd])=>tr([a,f(b,dd),f(c,dd)],'tot')).join(''));
  // phases
  const v = ev.vals;
  const ph = `<table class="xg kv">${[['C₃S %',f(v.C3S,1)],['C₂S %',f(v.C2S,1)],['C₃A %',f(v.C3A,1)],['C₄AF %',f(v.C4AF,1)],['Liquid 1450 °C %',f(v.LIQ,1)],['Burnability index',f(ev.bi,2)],['MBZT °C',f(ev.mbzt,0)],['Heat of reaction kcal/kg',f(ev.hor,0)],['ASR (molar)',f(v.ASR,2)],['Na₂O eq %',f(v.NAEQ,2)],['Raw meal : clinker',f(ev.rawMealFactor,3)],['Free lime assumed %',f(num(P.freeLime),2)]].map(([a,b])=>tr([a,b])).join('')}</table>`;
  // quality
  const mark = st => st==='ok' ? '<span class="xok">✓</span>' : st==='bind' ? '<span class="xbd">● limit</span>' : (st==='low'||st==='high') ? '<span class="xbad">✗ '+(st==='low'?'low':'high')+'</span>' : '';
  const q = tbl(['Parameter','Min','Max','Value','OK'], ev.lims.filter(l=>l.on).map(l=>tr([l.d.short,l.lo!==null?f(l.lo,l.d.dec):'–',l.hi!==null?f(l.hi,l.d.dec):'–',f(l.v,l.d.dec),mark(l.status)], (l.status==='low'||l.status==='high')?'xrow-bad':'')).join(''));
  // notes
  const bind = ev.lims.filter(l=>l.on&&l.status==='bind').map(l=>l.d.short), bad = ev.lims.filter(l=>l.on&&(l.status==='low'||l.status==='high')), w = processWarnings(ev);
  const status = r.status==='optimal' ? '<span class="xpill ok">OPTIMAL</span>' : '<span class="xpill bad">INFEASIBLE</span>';
  const pc = printCfg();
  return `<div class="xsheet">
    <div class="xhead"><div class="xco">${pc.logo?`<img src="${pc.logo}" alt="">`:''}<div><b>${esc(pc.company||P.name)}</b><span>${esc(P.unit)} · ${f(num(P.tpd),0)} TPD clinker · ${f(num(P.days),0)} days</span></div></div>
      <div class="xtitle">${esc(sc.name)}<span>${esc(sc.desc||'')}</span></div>
      <div class="xmeta">${status}<span>${d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</span>${pc.docno?`<span>${esc(pc.docno)} · Rev ${esc(pc.rev||'0')}</span>`:''}</div></div>
    <div class="xkpi"><div><span>Clinkering cost</span><b>₹${f(ev.total,1)}/t</b></div><div><span>Raw</span><b>₹${f(ev.rawCost,1)}</b></div><div><span>Fuel</span><b>₹${f(ev.fuelCost,1)}</b></div><div><span>Saving vs ${s?esc(s.name):'ref'}</span><b>${s?sgnR(s.total,2)+' '+BU():'–'}</b></div><div><span>LSF / SM / AM</span><b>${f(v.LSF,1)} / ${f(v.SM,2)} / ${f(v.AM,2)}</b></div><div><span>C₃S / Liquid</span><b>${f(v.C3S,1)} / ${f(v.LIQ,1)}</b></div><div><span>CO₂ kg/t</span><b>${f(ev.co2*1000,0)}</b></div></div>
    <div class="xgrid">
      <div class="xcol">${B('1. Raw mix &amp; feeder setpoints', raw)}${B('2. Fuel firing'+(ev.circuits?' — kiln burner &amp; precalciner':''), fuel)}
        <div class="xpair">${B('5. Kiln feed &amp; clinker chemistry', chem)}${B('6. Phases &amp; burnability', ph)}</div></div>
      <div class="xcol">${B('3. Cost summary', cost)}${ev.pile ? B('8. Limestone pile — % within limestone', tbl(['Source','% pile','TPD AR'], ev.pile.rows.map(x=>tr([esc(x.name),f(x.pct,2),f(x.tpdWet,0)])).join(''), tr(['Pile',`100.00`,f(ev.pile.tpdWet,0)],'tot')) + `<table class="xg kv">${[['CaO / SiO₂ %',`${f(ev.pile.vals.CaO,2)} / ${f(ev.pile.vals.SiO2,2)}`],['Al₂O₃ / Fe₂O₃ %',`${f(ev.pile.vals.Al2O3,2)} / ${f(ev.pile.vals.Fe2O3,2)}`],['MgO / LOI %',`${f(ev.pile.vals.MgO,2)} / ${f(ev.pile.vals.LOI,2)}`],['<b>LSF / SM / AM</b>',`<b>${f(ev.pile.vals.LSF,1)} / ${f(ev.pile.vals.SM,2)} / ${f(ev.pile.vals.AM,2)}</b>`]].concat(ev.pile.lims.filter(l=>l.on&&(l.status==='low'||l.status==='high')).map(l=>[`<span class="xbad">Pile ${l.d.label} outside</span>`,`<span class="xbad">${f(l.v,l.d.dec)} vs ${limTxt(l)}</span>`])).map(([a,b])=>tr([a,b])).join('')}</table>`) : ''}${B('4. Quality check', q)}
        ${B('7. Notes', `<div class="xnotes">${bind.length?`<p><b>On a limit:</b> ${bind.join(', ')}</p>`:''}${bad.length?`<p class="xbad"><b>Outside limits:</b> ${bad.map(l=>`${l.d.short} ${f(l.v,l.d.dec)}`).join(', ')}</p>`:''}${w.map(x=>`<p>${x}</p>`).join('')}${r.status!=='optimal'?`<p class="xbad"><b>${r.qMet?'Clinker quality met, but limit exceeded':'Not feasible'}:</b> ${(r.viol||[]).map(t=>esc(t.name)).join(', ')||esc(r.msg||'')}</p>`:''}${!bind.length&&!bad.length&&!w.length?'<p>All applied limits met with margin.</p>':''}</div>
        <div class="xsign"><div>Prepared</div><div>Checked</div><div>Approved</div></div>`)}</div>
    </div></div>`;
}
function rptSheets(){
  const pick = (printCfg().scen || []).filter(id => scById(id));
  const list = ST.scenarios.filter(sc => !pick.length || pick.includes(sc.id)).map(sc => ({sc, r:RES[sc.id]})).filter(x => x.r && x.r.ev);
  if (!list.length) return '<p>No scenario has results yet. Press Solve.</p>';
  return list.map(x => xsheet(x.sc, x.r)).join('');
}
function fitSheets(){
  const p = printCfg(), [w,h] = PAPER[p.paper] || PAPER.A4, pw = p.orient==='landscape'?h:w, ph = p.orient==='landscape'?w:h, m = MARG[p.margin] || MARG.normal;
  const top = p.hdrOn ? m[0]+8 : m[0], bot = p.ftrOn ? m[0]+6 : m[0], PX = 3.7795;
  const availH = (ph - top - bot) * PX * 0.97, availW = (pw - 2*m[1]) * PX;
  document.querySelectorAll('#rpt .xsheet').forEach(el => { el.style.zoom = 1; let z = 1;
    for (let i = 0; i < 4; i++){ el.style.width = (availW / z) + 'px'; const wpx = availW / z, zw = wpx / Math.max(el.scrollWidth, wpx); const nz = Math.min(1.25, availH / el.offsetHeight) * zw; if (Math.abs(nz - z) < 0.01) { z = nz; break; } z = nz; }
    z = Math.min(1.25, z); el.style.width = (availW / z) + 'px'; el.style.zoom = z.toFixed(3); el.dataset.fit = Math.round(z*100); });
}
