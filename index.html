function applyPreset(key){
  const p = LIMIT_PRESETS[key]; if (!p) return;
  if (!confirm(`Replace all global quality limits with “${p.name}”? Scenario overrides are kept.`)) return;
  ST.limits.forEach(L => { const v = p.v[L.k]; if (v){ L.on = true; L.lo = v[0]; L.hi = v[1]; } else { L.on = false; } });
  save(); recompute(); renderAll(); toast('Applied limits: '+p.name);
}

/* ---- USER GUIDE ---- */
VIEWS.guide = () => `<div class="prose">
  <div class="lede"><div><h2>User guide</h2><p class="muted">How to set up a plant, run the optimiser and use the results.</p></div></div>
  <div class="refnav"><a href="#g-quick">Quick start</a><a href="#g-tabs">Tab by tab</a><a href="#g-read">Reading results</a><a href="#g-infeas">When there is no feasible mix</a><a href="#g-reports">Reports</a><a href="#g-data">Saving and sharing</a><a href="#g-tips">Good practice</a><a href="#g-faq">FAQ</a></div>

  <h3 id="g-quick">Quick start</h3>
  <ol class="steps">
    <li><b>Plant &amp; basis</b> — enter clinker TPD, operating days, specific heat consumption and free lime. Pick your currency and number style.</li>
    <li><b>Raw materials</b> — one row per limestone and corrective: price as received, moisture and full dry-basis analysis including LOI. Untick a material to leave it out.</li>
    <li><b>Fuels</b> — price, CV (as fired), ash, sulphur, total and inherent moisture, then the ash analysis below.</li>
    <li><b>Stock at site</b> — enter stock, receipts and safety stock so the optimiser only uses what is physically available over the planning period.</li>
    <li><b>Quality limits</b> — tick the parameters to control and set min/max, or apply a preset and adjust.</li>
    <li><b>Scenarios</b> — each scenario is a fuel strategy. Fix shares (min = max), let the optimiser choose (0–100), or exclude (max 0).</li>
    <li><b>Optimum mix</b> — read the least-cost proportions, quality bands, costs, limit costs and price sensitivity. Everything updates as you type.</li>
    <li><b>Current mix</b> — enter what the plant runs today to see the cost gap and feeder changes.</li>
    <li><b>Reports</b> — choose Chemist, HOD, Top management or Consultant study, then print to PDF.</li>
  </ol>

  <h3 id="g-tabs">Tab by tab</h3>
  <dl class="gl">
    <dt>Plant &amp; basis</dt><dd>Operating basis shared by all scenarios, the objective (cost, CO₂ or cost plus a carbon price), the savings reference, regional settings, theme, font and text size, and data import/export. Theme and font can also be changed from the header.</dd>
    <dt>Raw materials</dt><dd>Σ % turns red when an analysis totals under 90% or over 100.5%. LSF of each material is shown so you can see sweeteners and silica sources at a glance. Min/max % limit a material’s share of the dry mix; availability limits as-received tonnes per day.</dd>
    <dt>Kiln + precalciner firing</dt><dd>On Plant &amp; basis set Firing system to “Kiln burner + precalciner” and the kiln’s share of heat (typically 35–45%). Each scenario then has separate kiln and precalciner fuel limits — for example petcoke only at the burner and an Indian/imported coal blend in the calciner — and the optimiser chooses each blend so its circuit delivers exactly its share of heat. Both ashes enter the clinker; results, reports and the Solver tab show each circuit separately plus the combined total.</dd>
    <dt>Limestone pile</dt><dd>Shows, for every scenario, the share of each limestone source within limestone only, the blended pile chemistry with LSF, SM and AM, and a stacking plan for a pile of the size you set. Optional pile limits (for example pile CaO ≥ 44% or LSF 105–120) become constraints in the optimisation; each scenario can override them.</dd>
    <dt>Fuels</dt><dd>CV and ash on as-fired basis; TM and IM convert as-fired tonnes to as-received for cost. Tick Biogenic for biomass so its CO₂ is reported separately. ₹ per 1000 kcal shows the true cost of heat.</dd>
    <dt>Stock at site</dt><dd>Stock on hand, expected receipts and safety stock for each material and fuel, plus a planning period. Available TPD = (stock + receipts − safety) ÷ days, capped by the daily supply limit. Each scenario can override stock, receipts, cap and period, or exclude a material, in its “Stock &amp; availability” section — this is applied before that scenario is solved.</dd>
    <dt>Quality limits</dt><dd>Global limits used by every scenario. Leave a bound blank for an open side. The Optimum and Status columns show the selected scenario live.</dd>
    <dt>Scenarios</dt><dd>Fuel share limits, heat consumption and limit overrides per scenario. ★ marks the cheapest feasible one. “Use as savings reference” sets the baseline for all savings figures.</dd>
    <dt>Solver</dt><dd>The optimisation behind every scenario: objective, decision variables, each constraint with value, limit, slack and binding status, plus a solve log with iterations and time. Switch to manual solving here if you prefer to press Solve, as in Excel.</dd>
    <dt>Optimum mix</dt><dd>The solved mix for the scenario chosen in the header.</dd>
    <dt>Compare</dt><dd>Pick any two scenarios (or the current mix) and see them side by side with B − A differences: cost, raw mix % and tonnage with stacked bars, limestone pile proportions and quality, fuel firing by circuit, and clinker chemistry and quality status. Green Δ on cost rows means B is cheaper. Print the comparison directly.</dd>
    <dt>Current mix</dt><dd>Evaluates a mix you enter (not optimised). “Fill from optimum” copies the optimum here as a starting point.</dd>
    <dt>Reports</dt><dd>Four audience-specific reports built from live results.</dd>
  </dl>

  <h3 id="g-read">Reading the results</h3>
  <p>Each quality band shows the allowed range in green, the value as a bar, and a dotted line for the comparison mix. Amber means the value sits exactly on a limit — that limit is holding the cost. Red means outside the range.</p>
  <p><b>What each limit costs</b> re-solves the problem with one binding limit relaxed by a small step and reports the saving. Large values point to limits worth reviewing with QC. <b>Price sensitivity</b> re-solves at ±10% price for each material; the longest bars are your biggest cost exposures.</p>
  <p><b>Process checks</b> appear in blue when an unlimited parameter (for example ASR with high-sulphur fuels) drifts outside its usual window. Management and consultant reports will not recommend a scenario with an open process check.</p>

  <h3 id="g-infeas">When there is no feasible mix</h3>
  <p>The app first checks whether clinker quality can be reached at all with your materials and fuels. With <b>Keep quality</b> (Plant &amp; basis, default) and quality reachable, it shows a mix that meets every quality limit and tells you exactly how much extra stock, or which mix or fuel-share limit, that mix needs. If quality cannot be reached even with unlimited stock, it shows the best achievable value of each failing parameter, the gap, and what kind of material would close it. It also lists any single change that would make the scenario fully solvable. Typical fixes, in order:</p>
  <ol class="steps"><li>Widen the listed limit slightly, or switch off one of two linked limits (C₃S, LSF and CaO together over-constrain easily).</li><li>Enable an extra corrective (iron or alumina source) or relax its max %.</li><li>Allow another fuel, or reduce the share of a high-ash or high-sulphur fuel.</li><li>Check analyses: a missing LOI or a decimal error is the most common cause.</li></ol>

  <h3 id="g-reports">Reports</h3>
  <dl class="gl"><dt>Chemist</dt><dd>Feeder setpoints, firing data, target chemistry and a compliance check with sign-off lines.</dd>
  <dt>HOD</dt><dd>Cost build-up, scenario comparison, cost of limits, sensitivity and observations.</dd>
  <dt>Top management</dt><dd>One-page recommendation with annual saving and key risks.</dd>
  <dt>One-page sheets</dt><dd>Excel-style print: each selected scenario on exactly one page with raw mix setpoints, fuel firing (kiln and precalciner), cost, quality check, chemistry, phases and notes in a gridded layout, scaled automatically to fit the paper.</dd>
  <dt>All scenarios</dt><dd>Scenario mix book: side-by-side tables of cost, raw mix %, daily tonnage, fuel mix (kiln, precalciner and combined) and clinker quality for every scenario, followed by a full page for each scenario with its mix, firing, chemistry and quality check.</dd>
  <dt>Consultant study</dt><dd>Full study: findings, action plan, material and fuel assessment, risk register, break-even prices, CO₂, roadmap, KPIs and appendices.</dd></dl>
  <p>Use Print / save PDF; each consultant section starts on a new page when printed.</p>

  <h3 id="g-data">Saving and sharing</h3>
  <p>Inputs save automatically in this browser on this device. Use Export data to keep a backup or send the plant file to a colleague, who loads it with Import data. Results can be downloaded as CSV for Excel.</p>

  <h3 id="g-tips">Good practice</h3>
  <ul class="tight">
    <li>Use monthly composite analyses rather than a single spot sample.</li>
    <li>Run the plant inside the band, not on the limit the optimiser found — leave about a quarter of the range as margin.</li>
    <li>Enter prices as received at the plant, including freight and handling.</li>
    <li>With petcoke or high-sulphur coal, apply the ASR and SO₃ limits.</li>
    <li>Re-run after any price change above about 5%, or when a new pile or fuel lot arrives.</li>
  </ul>

  <h3 id="g-faq">FAQ</h3>
  <dl class="gl">
    <dt>Why does it differ from the Excel Solver?</dt><dd>This model is linear and solved exactly, so it finds the global optimum; Solver’s GRG can stop at a local one. Fuel cost also uses (100−IM)/(100−TM) to convert as-fired to as-received tonnes.</dd>
    <dt>Can it handle AFR and biomass?</dt><dd>Yes. Add the fuel with its CV, ash and analysis, tick Biogenic, and set its share range. TSR is shown on the fuel mix.</dd>
    <dt>Does it model heat consumption change with fuel?</dt><dd>Not automatically. Set a different specific heat in the scenario if you expect one.</dd>
    <dt>Is my data sent anywhere?</dt><dd>No. All calculations run in your browser.</dd>
  </dl>
</div>`;

function constraintReport(res, sc){
  const M = res.model, ev = res.ev, x = res.x, P = ST.plant, out = [];
  const viol = new Set((res.viol||[]).map(t=>t.name));
  M.rows.forEach(r => {
    const t = r.tag, lhs = r.a.reduce((s,a,j)=>s+a*x[j],0), resid = lhs - r.b;
    let status = Math.abs(resid) < 1e-6 ? 'bind' : 'ok';
    if (r.op==='>=' && resid < -1e-6) status = 'viol'; if (r.op==='<=' && resid > 1e-6) status = 'viol';
    if (r.op==='=') status = Math.abs(resid) < 1e-6 ? 'eq' : 'viol';
    if (viol.has(t.name)) status = 'viol';
    let val = NaN, lim = NaN, dec = 2, unit = '';
    if (t.name === 'Clinker mass balance'){ val = ev.mass; lim = 1; dec = 4; unit = 't/t clinker'; }
    else if (t.kind === 'heat'){ val = t.circ && ev.circuits ? ev.circuits[t.circ].heat : ev.heat; lim = t.lim; dec = 0; unit = 'kcal/kg clinker'; }
    else if (t.kind === 'rmin' || t.kind === 'rmax'){ const m = ST.raws.find(z=>z.id===t.id), row = ev.rawRows.find(z=>z.id===t.id); val = row ? row.pct : 0; lim = num(t.kind==='rmin'?m.min:m.max); unit = '% dry mix'; }
    else if (t.kind === 'fmin' || t.kind === 'fmax'){ val = shareRow(ev, t); lim = t.bound; dec = 1; unit = (P.shareBasis==='heat'?'% of heat':'% of fuel') + (t.circ ? ' in '+circName(t.circ).toLowerCase() : ''); }
    else if (t.kind === 'avail'){ const row = ev.rawRows.find(z=>z.id===t.id) || ev.fuelRows.find(z=>z.id===t.id), m = ST.raws.find(z=>z.id===t.id) || ST.fuels.find(z=>z.id===t.id); val = row ? (row.tpdWet ?? row.tpdAR) : 0; lim = availInfo(ST, sc, m).lim; dec = 0; unit = 'TPD as recd'; }
    else if (t.kind === 'pq'){ const l = ev.pile && ev.pile.lims.find(z=>z.k===t.k); val = l ? l.v : NaN; lim = t.bound; dec = l ? l.d.dec : 2; unit = 'limestone pile'; }
    else if (t.kind === 'q'){ const l = ev.lims.find(z=>z.k===t.k); val = l.v; lim = t.side==='lo'?l.lo:l.hi; dec = l.d.dec; unit = l.d.unit||'ratio'; }
    const rel = r.op==='=' ? '=' : r.op==='>=' ? '≥' : '≤';
    out.push({name:t.name, hard:!!t.hard, val, rel, lim, slack: Math.abs(val-lim), dec, unit, status});
  });
  return out;
}

function stockRows(sc, ev){
  const items = ST.raws.filter(m=>m.on).map(m=>({m, t:'Raw material'})).concat(ST.fuels.filter(x=>x.on).map(m=>({m, t:'Fuel'})));
  return items.map(({m,t}) => { const av = availInfo(ST, sc, m), row = ev && (ev.rawRows.find(z=>z.id===m.id) || ev.fuelRows.find(z=>z.id===m.id));
    const req = row ? (row.tpdWet ?? row.tpdAR) : 0, util = av.lim !== null && av.lim > 0 ? req/av.lim*100 : (av.lim === 0 && req > 0 ? Infinity : NaN);
    const cover = av.stock !== null && req > 0 ? (av.stock + av.rcpt - av.safety)/req : NaN;
    let st = 'none'; if (!av.use) st = 'excl'; else if (av.lim !== null){ st = util >= 99.5 ? 'bind' : util > 85 ? 'tight' : 'ok'; }
    return {m, t, av, req, util, cover, st}; });
}
const stPill = s => ({bind:'<span class="pill bind">Limiting</span>', tight:'<span class="pill bind">Tight</span>', ok:'<span class="pill ok">Enough</span>', none:'<span class="pill off">No limit</span>', excl:'<span class="pill off">Excluded</span>'}[s]);
function stockTable(sc, ev){

  if (!rows.length) return '<p class="muted">No stock or supply limits are set, so every material is treated as unlimited.</p>';
  return `<div class="tw"><table><thead><tr><th class="l">Material</th><th>Stock t</th><th>Receipts t</th><th>Safety t</th><th>Period days</th><th>Available TPD</th><th class="l">Set by</th><th>Required TPD</th><th>Use %</th><th>Days of cover</th><th class="l">Status</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="l">${esc(r.m.name)}</td><td>${r.av.stock!==null?f(r.av.stock,0):'–'}</td><td>${r.av.rcpt?f(r.av.rcpt,0):'–'}</td><td>${r.av.safety?f(r.av.safety,0):'–'}</td><td>${r.av.stock!==null?f(r.av.days,0):'–'}</td><td>${r.av.lim!==null?f(r.av.lim,0):'∞'}</td><td class="l small">${r.av.use?r.av.src:'Excluded in scenario'}</td><td>${f(r.req,0)}</td><td>${isFinite(r.util)?f(r.util,0):'–'}</td><td>${isFinite(r.cover)?f(r.cover,0):'–'}</td><td class="l">${stPill(r.st)}</td></tr>`).join('')}
  </tbody></table></div><p class="small muted">Tonnes as received. Available TPD = (stock + receipts − safety stock) ÷ planning period, or the supply cap if lower. Days of cover = usable stock ÷ required TPD.</p>`;

function fixesHTML(r, sc){

  const rows = r.fixes.map(fx => { const t = fx.tag, e = fx.ev; let what = '', need = '';
    if (t.kind === 'q'){ const l = e.lims.find(z=>z.k===t.k); what = `Widen ${l.d.label} (now ${limTxt(l)})`; need = `${l.d.short} ${f(l.v,l.d.dec)}`; }
    else if (t.kind === 'avail'){ const m = ST.raws.find(z=>z.id===t.id) || ST.fuels.find(z=>z.id===t.id), av = availInfo(ST, sc, m), row = e.rawRows.find(z=>z.id===t.id) || e.fuelRows.find(z=>z.id===t.id); const req = row ? (row.tpdWet ?? row.tpdAR) : 0;
      what = `More ${esc(m.name)} at site (now ${f(av.lim,0)} TPD)`; need = `${f(req,0)} TPD${av.stock!==null?` · ${f(req*av.days + av.safety - av.rcpt,0)} t stock over ${f(av.days,0)} days`:''}`; }
    else if (t.kind === 'pq'){ const l = e.pile && e.pile.lims.find(z=>z.k===t.k); what = `Widen limestone pile ${l?l.d.label:t.k} (now ${l?limTxt(l):''})`; need = l ? `pile ${l.d.label} ${f(l.v,l.d.dec)}` : ''; }
    else if (t.kind === 'rmin' || t.kind === 'rmax'){ const m = ST.raws.find(z=>z.id===t.id), row = e.rawRows.find(z=>z.id===t.id); what = `Change ${esc(m.name)} mix limit (min ${blank(m.min)?'–':m.min}, max ${blank(m.max)?'–':m.max}%)`; need = `${f(row?row.pct:0,2)}% of mix`; }

    return `<tr><td class="l wrap">${what}</td><td>${need}</td><td>₹${f(e.total,1)}</td></tr>`; }).join('');

/* ---- LIMESTONE PILE ---- */
const pileMark = st => ({ok:'<span class="pill ok">Within</span>', bind:'<span class="pill bind">At limit</span>', low:'<span class="pill bad">Below min</span>', high:'<span class="pill bad">Above max</span>', off:''}[st]||'');

  return `<div class="lede"><div><h2>Limestone pile</h2><p class="muted">The blended limestone pile the stacker must build for each scenario: proportion of each limestone source <b>within limestone only</b>, and the pile’s chemistry, LSF, SM and AM. Set pile quality limits here and the optimiser respects them when choosing the mix.</p></div></div>
  <div class="panel"><h3 style="margin-top:0">Limestone sources</h3><p class="small muted">Any raw material with Type = Limestone (Raw materials tab) is part of the pile.</p>
    <div class="tw"><table><thead><tr><th class="l">Source</th><th>CaO</th><th>SiO₂</th><th>Al₂O₃</th><th>Fe₂O₃</th><th>MgO</th><th>LOI</th><th>LSF</th><th>SM</th><th>AM</th><th>Moist %</th></tr></thead><tbody>
    ${ls.map(m=>`<tr><td class="l">${esc(m.name)}</td>${['CaO','SiO2','Al2O3','Fe2O3','MgO','LOI'].map(k=>`<td>${f(num(m.chem[k]),2)}</td>`).join('')}<td>${den(m)>0?f(100*num(m.chem.CaO)/den(m),1):'–'}</td><td>${f(num(m.chem.SiO2)/(num(m.chem.Al2O3)+num(m.chem.Fe2O3)),2)}</td><td>${f(num(m.chem.Al2O3)/num(m.chem.Fe2O3),2)}</td><td>${f(num(m.moist),1)}</td></tr>`).join('') || `<tr><td class="l" colspan="11">No raw material is typed as Limestone.</td></tr>`}
    </tbody></table></div>
    <div class="fields" style="margin-top:12px">${fld('Pile size for stacking plan (t, as received)','pileSize',ST.pileSize)}</div></div>
  <div class="panel"><h3 style="margin-top:0">Pile quality limits</h3><p class="small muted">Optional. Use them when the crusher/stacker can only build piles within a CaO, LSF or SM band. Blank = open side. Value and status show the selected scenario (<b>${esc(selSc().name)}</b>). Each scenario can override these.</p>
    <div class="tw"><table class="inp"><thead><tr><th class="c">Apply</th><th class="l">Pile parameter</th><th>Minimum</th><th>Maximum</th><th>Value</th><th class="l">Status</th></tr></thead><tbody>
    ${ST.pileLimits.map((L,i)=>{ const d = PILE_DEFS.find(x=>x.k===L.k); if (!d) return ''; return `<tr class="${L.on?'':'off'}"><td class="c">${cb(`pileLimits.${i}.on`,L.on,1)}</td><td class="l" style="padding:6px 8px">${d.label}${d.unit?' %':''}</td><td>${ni(`pileLimits.${i}.lo`,L.lo,'open')}</td><td>${ni(`pileLimits.${i}.hi`,L.hi,'open')}</td>${`<td colspan="2" style="padding:0"><table style="width:100%"><tr data-live="pilelim:${L.k}">${LIVE.pilelim(L.k)}</tr></table></td>`}</tr>`; }).join('')}
    </tbody></table></div></div>
  <div class="panel"><h3 style="margin-top:0">Selected scenario — ${esc(selSc().name)}</h3><div data-live="pilesel">${LIVE.pilesel()}</div></div>
  <h3>Limestone pile by scenario</h3><div data-live="pilemx">${LIVE.pilemx()}</div>
  <p class="note">Red = outside a pile limit; amber = on a limit. Pile limits are treated as operating limits: if they cannot be met together with clinker quality, the scenario is reported infeasible and the pile limit is listed as the one to relax.</p>`;
};

/* ---- COMPARE TWO OPTIONS ---- */
const CMP_COLORS = ['#245B7A','#B8620F','#2C7A4B','#8C2E22','#6B4C9A','#0F6E7C','#A0802E','#55606B','#C0567A','#3D8C8C'];
function cmpGet(id){ if (id === 'current') return CUR ? {name:'Current mix', ev:CUR.ev, status:'manual'} : null; const sc = scById(id), r = RES[id]; return sc && r && r.ev ? {name:sc.name, desc:sc.desc, ev:r.ev, status:r.status} : null; }
function cmpIds(){ ST.cmp = ST.cmp || {}; const ids = ST.scenarios.map(s=>s.id).concat(CUR?['current']:[]);
  if (!ids.includes(ST.cmp.a)) ST.cmp.a = (refInfo() && refInfo().id) || ST.scenarios[0].id;
  if (!ids.includes(ST.cmp.b)) ST.cmp.b = ST.sel !== ST.cmp.a ? ST.sel : (ST.scenarios[1]||ST.scenarios[0]).id;
  return ST.cmp; }
function dCell(d, dec, goodLow){ if (!isFinite(d)) return '<td>–</td>'; if (Math.abs(d) < 0.5*Math.pow(10,-dec)) return '<td class="muted">0</td>';
  const cls = goodLow === undefined ? '' : ((d < 0) === goodLow ? 'dgood' : 'dbad'); return `<td class="${cls}"><b>${sgn(d,dec)}</b></td>`; }
const cRow = (label, a, b, dec, goodLow, fmt) => `<tr><td class="l">${label}</td><td>${fmt?fmt(a):f(a,dec)}</td><td>${fmt?fmt(b):f(b,dec)}</td>${dCell(b-a,dec,goodLow)}</tr>`;
function stackBar(rows, colorOf){ return `<div class="sbar">${rows.filter(r=>r.v>0.05).map(r=>`<span style="width:${r.v}%;background:${colorOf(r.id)}" title="${esc(r.name)} ${f(r.v,2)}%">${r.v>8?f(r.v,1):''}</span>`).join('')}</div>`; }
VIEWS.compare = () => {
  const c = cmpIds(), A = cmpGet(c.a), B = cmpGet(c.b);
  const opts = sel => ST.scenarios.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('') + (CUR?`<option value="current" ${sel==='current'?'selected':''}>Current mix</option>`:'');
  const head = `<div class="lede noprint"><div><h2>Compare two options</h2><p class="muted">Pick any two scenarios (or the current mix). Δ = B − A. For costs, green means B is cheaper.</p></div>
    <div class="btns"><button class="btn" onclick="const t=ST.cmp.a;ST.cmp.a=ST.cmp.b;ST.cmp.b=t;save();renderTab()">Swap A ⇄ B</button><button class="btn primary" data-a="print">Print comparison</button></div></div>
    <div class="panel noprint"><div class="fields"><div class="field"><label for="cmpa">Option A</label><select id="cmpa" data-b="cmp.a" data-t="s" data-rr="1">${opts(c.a)}</select></div><div class="field"><label for="cmpb">Option B</label><select id="cmpb" data-b="cmp.b" data-t="s" data-rr="1">${opts(c.b)}</select></div></div></div>`;
  if (!A || !B) return head + '<p class="muted">One of the chosen options has no result. Press Solve.</p>';
  const a = A.ev, b = B.ev, k = num(ST.plant.tpd)*num(ST.plant.days)/BIGD();
  const dT = b.total - a.total, dR = b.rawCost - a.rawCost, dF = b.fuelCost - a.fuelCost;
  // material shifts
  const rawIds = ST.raws.filter(m => a.rawRows.find(z=>z.id===m.id) || b.rawRows.find(z=>z.id===m.id));
  const pr = (ev,id,key) => (ev.rawRows.find(z=>z.id===id)||{})[key] || 0;
  const shifts = rawIds.map(m=>({n:m.name, d:pr(b,m.id,'pct')-pr(a,m.id,'pct')})).filter(x=>Math.abs(x.d)>0.05).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  const stat = (o) => o.status==='optimal' ? '<span class="pill ok">Optimal</span>' : o.status==='manual' ? '<span class="pill off">Entered</span>' : '<span class="pill bad">Infeasible</span>';
  const summary = `<div class="banner ${dT<=0?'ok':'info'}"><b>${esc(B.name)}</b> is <b>${dT<=0?'cheaper':'dearer'}</b> than <b>${esc(A.name)}</b> by <b>₹${f(Math.abs(dT),1)}/t clinker</b> (${sgnR(-dT*k,2)} ${BU()} per year to B’s ${dT<=0?'advantage':'disadvantage'}).
    Fuel ${sgn(dF,1)} ₹/t, raw materials ${sgn(dR,1)} ₹/t.${shifts.length?` Largest mix shifts: ${shifts.slice(0,3).map(s=>`${esc(s.n)} ${sgn(s.d,1)} pts`).join(', ')}.`:''} CO₂ ${sgn((b.co2-a.co2)*1000,0)} kg/t.</div>`;
  const tiles = (O, cls) => `<div class="cmpcol ${cls}"><div class="cmph">${cls==='A'?'A':'B'} · ${esc(O.name)} ${stat(O)}</div><div class="small muted">${esc(O.desc||'')}</div>
    <div class="cmpk"><div><span>Clinkering cost</span><b>₹${f(O.ev.total,1)}</b></div><div><span>Raw / fuel</span><b>₹${f(O.ev.rawCost,0)} / ₹${f(O.ev.fuelCost,0)}</b></div><div><span>LSF / SM / AM</span><b>${f(O.ev.vals.LSF,1)} / ${f(O.ev.vals.SM,2)} / ${f(O.ev.vals.AM,2)}</b></div><div><span>CO₂ kg/t</span><b>${f(O.ev.co2*1000,0)}</b></div></div></div>`;
  const TH = `<thead><tr><th class="l"></th><th>A · ${esc(A.name)}</th><th>B · ${esc(B.name)}</th><th>Δ B − A</th></tr></thead>`;
  // cost
  const cost = `<div class="tw"><table class="cmpt">${TH}<tbody>
    ${cRow('Raw materials, ₹/t clinker',a.rawCost,b.rawCost,1,true)}${cRow('Fuel, ₹/t clinker',a.fuelCost,b.fuelCost,1,true)}
    <tr class="tot"><td class="l">Clinkering cost, ₹/t</td><td>${f(a.total,1)}</td><td>${f(b.total,1)}</td>${dCell(dT,1,true)}</tr>
    ${cRow(`Cost per year, ₹ ${BU()}`,a.total*k,b.total*k,2,true)}${cRow('Fuel on clinker, %',a.fuelPerClk*100,b.fuelPerClk*100,2)}${cRow('Specific heat, kcal/kg',a.heat,b.heat,0)}
    ${cRow('Raw meal : clinker',a.rawMealFactor,b.rawMealFactor,3)}${cRow('CO₂, kg/t clinker',a.co2*1000,b.co2*1000,0,true)}</tbody></table></div>`;
  // raw mix
  const raw = `<div class="tw"><table class="cmpt"><thead><tr><th class="l">Raw material</th><th>A % dry</th><th>B % dry</th><th>Δ pts</th><th>A TPD AR</th><th>B TPD AR</th><th>Δ TPD</th></tr></thead><tbody>
    ${rawIds.map(m=>`<tr><td class="l"><i class="dot" style="background:${CMP_COLORS[ST.raws.indexOf(m)%CMP_COLORS.length]}"></i>${esc(m.name)}</td><td>${f(pr(a,m.id,'pct'),2)}</td><td>${f(pr(b,m.id,'pct'),2)}</td>${dCell(pr(b,m.id,'pct')-pr(a,m.id,'pct'),2)}<td>${f(pr(a,m.id,'tpdWet'),0)}</td><td>${f(pr(b,m.id,'tpdWet'),0)}</td>${dCell(pr(b,m.id,'tpdWet')-pr(a,m.id,'tpdWet'),0)}</tr>`).join('')}
    <tr class="tot"><td class="l">Raw cost, ₹/t clk</td><td>${f(a.rawCost,1)}</td><td>${f(b.rawCost,1)}</td>${dCell(dR,1,true)}<td>${f(a.rawRows.reduce((s,z)=>s+z.tpdWet,0),0)}</td><td>${f(b.rawRows.reduce((s,z)=>s+z.tpdWet,0),0)}</td>${dCell(b.rawRows.reduce((s,z)=>s+z.tpdWet,0)-a.rawRows.reduce((s,z)=>s+z.tpdWet,0),0)}</tr></tbody></table></div>
    <div class="cmpbars"><div><span>A</span>${stackBar(a.rawRows.map(r=>({id:r.id,name:r.name,v:r.pct})), id=>CMP_COLORS[ST.raws.findIndex(m=>m.id===id)%CMP_COLORS.length])}</div><div><span>B</span>${stackBar(b.rawRows.map(r=>({id:r.id,name:r.name,v:r.pct})), id=>CMP_COLORS[ST.raws.findIndex(m=>m.id===id)%CMP_COLORS.length])}</div></div>`;
  // pile
  let pile = '';
  if (a.pile || b.pile){ const ids = ST.raws.filter(m => isLS(m) && ((a.pile&&a.pile.rows.find(z=>z.id===m.id))||(b.pile&&b.pile.rows.find(z=>z.id===m.id))));
    const pp = (ev,id) => ev.pile ? ((ev.pile.rows.find(z=>z.id===id)||{}).pct||0) : NaN, pv = (ev,key) => ev.pile ? ev.pile.vals[key] : NaN;
    pile = `<div class="tw"><table class="cmpt">${TH}<tbody>
      <tr class="sub"><td class="l" colspan="4">Proportion within limestone, % dry</td></tr>
      ${ids.map(m=>cRow(esc(m.name),pp(a,m.id),pp(b,m.id),2)).join('')}
      ${cRow('Limestone in raw mix, %',a.pile?a.pile.share:NaN,b.pile?b.pile.share:NaN,1)}
      <tr class="sub"><td class="l" colspan="4">Pile quality, dry</td></tr>
      ${PILE_DEFS.filter(d=>['CaO','SiO2','Al2O3','Fe2O3','MgO','LOI','LSF','SM','AM'].includes(d.k)).map(d=>cRow(d.label+(d.unit?' %':''),pv(a,d.k),pv(b,d.k),d.dec)).join('')}</tbody></table></div>`; }
  // fuel
  const fIds = ST.fuels.filter(m => a.fuelRows.find(z=>z.id===m.id) || b.fuelRows.find(z=>z.id===m.id));
  const fp = (ev,id,cc) => cc ? (ev.circuits ? ((ev.circuits[cc].rows.find(z=>z.id===id)||{}).pct||0) : NaN) : ((ev.fuelRows.find(z=>z.id===id)||{}).pct||0);
  const dual = a.circuits || b.circuits;
  const fuelSec = (cc, lab) => `<tr class="sub"><td class="l" colspan="4">${lab}</td></tr>${fIds.map(m=>cRow(esc(m.name),fp(a,m.id,cc),fp(b,m.id,cc),1)).join('')}`;
  const fuel = `<div class="tw"><table class="cmpt">${TH}<tbody>
    ${dual ? fuelSec('K','Kiln burner, % mass') + fuelSec('P','Precalciner, % mass') : ''}${fuelSec(null, dual ? 'Combined, % mass' : 'Fuel, % mass')}
    ${cRow('Mix CV, kcal/kg',a.mixCV,b.mixCV,0)}${cRow('Mix ash, %',a.mixAsh,b.mixAsh,1)}${cRow('Mix sulphur, %',a.mixS,b.mixS,2)}${cRow('Ash absorbed, % clk',a.ashAbs,b.ashAbs,2)}
    ${cRow('Fuel TPD as received',a.fuelRows.reduce((s,z)=>s+z.tpdAR,0),b.fuelRows.reduce((s,z)=>s+z.tpdAR,0),0)}${cRow('Fuel, ₹/t clinker',a.fuelCost,b.fuelCost,1,true)}</tbody></table></div>`;
  // clinker
  const lim = (ev,kk) => ev.lims.find(l=>l.k===kk);
  const qKeys = ['LSF','SM','AM','C3S','C2S','C3A','C4AF','LIQ','SiO2','Al2O3','Fe2O3','CaO','MgO','SO3','K2O','Na2O','NAEQ','Cl','ASR'];
  const mk = l => !l || !l.on ? '' : (l.status==='low'||l.status==='high') ? ' <span class="xbad">✗</span>' : l.status==='bind' ? ' <span class="xbd">●</span>' : ' <span class="xok">✓</span>';
  const clk = `<div class="tw"><table class="cmpt"><thead><tr><th class="l">Clinker</th><th>Limit</th><th>A · ${esc(A.name)}</th><th>B · ${esc(B.name)}</th><th>Δ B − A</th></tr></thead><tbody>
    ${qKeys.map(kk=>{ const la = lim(a,kk), lb = lim(b,kk); if (!la) return ''; return `<tr${['LSF','SM','AM'].includes(kk)?' class="tot"':''}><td class="l">${la.d.label}</td><td class="small">${la.on?limTxt(la):'–'}</td><td>${f(la.v,la.d.dec)}${mk(la)}</td><td>${f(lb.v,lb.d.dec)}${mk(lb)}</td>${dCell(lb.v-la.v,la.d.dec)}</tr>`; }).join('')}
    ${cRow('Burnability index',a.bi,b.bi,2)}${cRow('MBZT, °C',a.mbzt,b.mbzt,0)}${cRow('Heat of reaction, kcal/kg',a.hor,b.hor,0)}</tbody></table></div>
    <p class="small muted">✓ within · ● on a limit · ✗ outside an applied limit.</p>`;
  return head + `<div class="cmpwrap">${summary}<div class="cmphead">${tiles(A,'A')}${tiles(B,'B')}</div>
    <div class="grid g2"><div class="panel"><h3 style="margin-top:0">Cost &amp; performance</h3>${cost}</div><div class="panel"><h3 style="margin-top:0">Raw mix</h3>${raw}</div></div>
    <div class="grid g2"><div class="panel"><h3 style="margin-top:0">Limestone pile</h3>${pile||'<p class="muted">No limestone sources.</p>'}</div><div class="panel"><h3 style="margin-top:0">Fuel firing</h3>${fuel}</div></div>
    <div class="panel"><h3 style="margin-top:0">Clinker chemistry, phases &amp; quality</h3>${clk}</div></div>`;
};

function printValues(on){
  document.querySelectorAll('main .pval').forEach(n=>n.remove());
  if (!on) return;
  document.querySelectorAll('main input[type=number], main input[type=text], main select').forEach(el => {
    if (el.closest('.pp, .noprint')) return;
    const s = document.createElement('span'); s.className = 'pval';
    s.textContent = el.tagName === 'SELECT' ? (el.options[el.selectedIndex] ? el.options[el.selectedIndex].text : '') : (el.value !== '' ? el.value : (el.placeholder && el.placeholder !== '–' ? el.placeholder : '–'));
    if (el.tagName !== 'SELECT' && el.value === '') s.classList.add('ph');
    el.after(s); });
}
window.addEventListener('beforeprint', () => { try{ applyPrint(); printValues(TAB !== 'reports'); if (TAB === 'reports' && REPORT === 'sheets') fitSheets(); }catch(e){} });
window.addEventListener('afterprint', () => { try{ printValues(false); }catch(e){} });
/* ---- boot ---- */
function boot(){
  recompute(); renderAll();
  if (window.__USED_EMBED__) setTimeout(()=>toast('Opened with the data saved in this file'), 300);
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(d => { DL = d; if (d) renderAll(); }).catch(()=>{});
  }
}
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('scen')){ e.preventDefault(); e.target.click(); } });
boot();

</script>
